# 이 컴퓨터에서만 열립니다. 다른 컴퓨터에서는 접속되지 않습니다.
server.address=127.0.0.1
server.port=47321
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.local.audit=INFO
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
# 데이터 폴더. 비워 두면 실행 위치의 var 폴더를 씁니다.
audit.home=
# 켜질 때 띄우는 화면. app: 전용 창(Edge·Chrome), browser: 기본 브라우저, none: 띄우지 않음
audit.window=app
# 전용 창에 쓸 프로그램을 직접 정할 때만 적습니다.
audit.browser-path=
