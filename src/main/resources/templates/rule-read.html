<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>사규 읽기 · 사규</title></head>
<body>
<th:block id="content">
<h1 th:if="${m == null}">사규를 찾을 수 없음</h1>
<th:block th:if="${m != null}" th:with="r=${m.reg}, row=${m.row}, v=${m.version}">
<div class="rule-page">
<div class="page-head">
    <div>
        <p class="kicker" th:text="|${row.category()} · ${v != null ? v.label : ''} · 시행 ${row.effectiveDate()}${#strings.isEmpty(row.owner()) ? '' : ' · 주관 ' + row.owner()}|">카테고리</p>
        <h1 th:text="${row.title()}">사규</h1>
        <p class="review-line" th:if="${!#strings.isEmpty(row.reviewText())}">
            <span class="pill" th:classappend="${row.reviewTone()}" th:text="${row.reviewText()}"></span>
            <span class="small muted" th:text="|검토 주기 ${row.reviewMonths()}개월|"></span>
            <form method="post" th:action="|/rules/${row.id()}/reviewed|" data-write="1" class="inline-form no-print" data-confirm="이 사규를 오늘 검토한 것으로 기록할까요? 다음 검토일이 다시 계산됩니다.">
                <button type="submit" class="btn btn-quiet">검토 완료</button></form>
        </p>
        <p class="hint" th:if="${!m.current}">지난 판을 보고 있습니다. 북마크·메모·고치기는 지금 판에서만 됩니다.</p>
        <p class="hint" th:if="${m.diff}">바로 앞 판과 견주어 보고 있습니다. <span class="dtag new">신설</span> <span class="dtag chg">변경</span> <span class="dtag del">삭제</span></p>
    </div>
    <div class="row-actions">
        <form method="get" th:action="|/rules/${row.id()}|" class="inline-form" th:if="${#lists.size(m.versions) > 1}">
            <label class="field">판
                <select name="v" data-autosubmit>
                    <option th:each="x : ${m.versions}" th:value="${x.id}" th:text="|${x.label} (${#strings.substring(x.effectiveDate + '          ', 0, 10).trim()})|" th:selected="${v != null and x.id == v.id}"></option>
                </select>
            </label>
        </form>
        <a class="btn" th:if="${m.prevVersion != null and !m.diff}" th:href="@{|/rules/${row.id()}|(v=${v.id},diff=1)}">앞 판과 견주기</a>
        <a class="btn" th:if="${m.diff}" th:href="@{|/rules/${row.id()}|(v=${v.id})}">견주기 끄기</a>
        <a class="btn" th:href="@{/rules/new(revise=${row.id()})}">개정판 넣기</a>
        <a class="btn" th:href="|/rules/${row.id()}/export|">글로 내려받기</a>
        <a class="btn" th:if="${orig != null}" th:href="|/original/rule-${row.id()}|" target="_blank" rel="noopener" title="등록할 때 올린 원본 파일의 모양 그대로(새 창, 글자 찾기 됨, 고칠 수 없음)">원본 보기</a>
        <form method="post" th:action="|/rules/${row.id()}/original|" enctype="multipart/form-data" data-write="1" class="inline-form no-print orig-up"
              th:data-confirm="${orig != null} ? '원본 파일을 바꿀까요? 원본 보기만 바뀌고 조문은 그대로입니다.' : null">
            <label class="btn" th:title="${orig != null} ? '원본 보기에 쓸 파일을 바꿉니다. 조문은 바뀌지 않습니다.' : '한글·워드·PDF 원본을 올리면 원본 모양 그대로 볼 수 있습니다. 조문은 바뀌지 않습니다.'"
                   ><span th:text="${orig != null} ? '원본 바꾸기' : '원본 파일 붙이기'">원본 파일 붙이기</span><input type="file" name="upload" hidden accept=".hwp,.hwpx,.doc,.docx,.rtf,.odt,.pdf,.xls,.xlsx,.xlsm,.ods,.ppt,.pptx,.odp,.png,.jpg,.jpeg" data-autosubmit /></label>
        </form>
        <button type="button" class="btn" data-dialog="meta-dialog">사규 수정</button>
        <a class="btn" th:href="@{/rules/new(edit=${row.id()})}" th:if="${m.current}" title="분석 미리보기 편집기에서 조를 고치고·합치고·나누고·지웁니다">조문 전체 고치기</a>
        <a class="btn" th:href="@{/rules/new(replace=${row.id()})}" th:if="${m.current}" title="한글·워드·PDF 문서를 골라 지금 판의 조문 전체를 그 문서 내용으로 바꿉니다(판은 늘지 않음)">문서로 통째로 바꾸기</a>
        <form method="post" th:action="|/rules/${row.id()}/delete|" data-write="1" class="inline-form" th:data-confirm="|「${row.title()}」를 지울까요? 모든 판과 메모·북마크가 함께 지워집니다.|">
            <button type="submit" class="btn btn-danger">사규 삭제</button></form>
    </div>
</div>
<form method="get" th:action="|/rules/${row.id()}|" class="toolbar" style="margin-bottom:14px">
    <input type="hidden" name="v" th:value="${v != null ? v.id : ''}" />
    <div class="search-row">
        <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="sr">이 사규에서 표시</span>
            <input name="q" th:value="${m.q}" placeholder="이 사규 안에서 찾기 — 적으면 해당 조가 아래에 나옵니다" maxlength="80" autocomplete="off"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="rfind" data-rule-find />
        </label>
        <button class="btn" type="submit" title="찾은 말을 본문 전체에 노란색으로 표시합니다">표시</button>
    </div>
    <div class="rfind" id="rfind" role="listbox" hidden></div>
</form>
<div class="reg-layout">
    <div class="reg-main">
        <th:block th:each="a : ${m.items}">
            <h2 class="chap" th:if="${a.newChapter()}" th:text="${a.chapter()}"></h2>
            <article class="art" th:id="|a-${a.id()}|">
                <header>
                    <h3 th:text="${a.label()}">제1조(목적)</h3>
                    <span class="dtag new" th:if="${a.tag() == 'new'}">신설</span>
                    <span class="dtag chg" th:if="${a.tag() == 'chg'}">변경</span>
                    <span class="pill warn" th:if="${a.difficult()}">해석 어려움</span>
                    <div class="acts" th:if="${m.current}">
                        <form method="post" th:action="|/rules/${row.id()}/art/${a.id()}/bookmark|" data-write="1">
                            <button type="submit" th:class="${a.bookmarked()} ? 'on'" th:text="${a.bookmarked()} ? '북마크됨' : '북마크'"></button>
                        </form>
                        <form method="post" th:action="|/rules/${row.id()}/art/${a.id()}/difficult|" data-write="1">
                            <button type="submit" th:class="${a.difficult()} ? 'on'">해석 어려움</button>
                        </form>
                        <a th:href="@{/discipline/new(ruleText=${row.title() + ' ' + a.label()})}" title="이 조문을 관련규정으로 넣어 징계기록 등재">징계 등재</a>
                        <button type="button" th:attr="data-open=|ed-${a.id()}|">수정</button>
                        <form method="post" th:action="|/rules/${row.id()}/art/${a.id()}/remove|" data-write="1" th:data-confirm="|${a.label()}를 지울까요? 지금 판에서만 지워집니다.|">
                            <button type="submit" class="danger-text">삭제</button></form>
                    </div>
                </header>
                <div class="abody" th:utext="${a.html()}"></div>
                <div class="anote rich" th:if="${!#strings.isEmpty(a.note())}" th:utext="${a.noteHtml()}"></div>
                <details th:if="${m.current}" class="art-edit" th:id="|ed-${a.id()}|">
                    <summary class="small muted">조문 수정</summary>
                    <form method="post" th:action="|/rules/${row.id()}/art/${a.id()}/edit|" data-write="1" style="margin-top:8px">
                        <label class="field">조 제목<input name="title" maxlength="120" th:value="${a.title()}" /></label>
                        <label class="field grow" style="margin-top:6px"><span class="flabel">본문 <span class="field-note">①②는 항, 1.은 호, 가.는 목으로 들여 씁니다. 표는 | 칸 | 칸 | 꼴로 적습니다.</span></span>
                            <textarea name="content" rows="10" th:text="${a.raw()}" data-rich="html" th:attr="data-html=${a.editHtml()}"></textarea></label>
                        <p style="margin-top:6px"><button type="submit" class="btn">조문 저장</button></p>
                    </form>
                </details>
                <details th:if="${m.current}" class="art-memo" th:id="|memo-${a.id()}|">
                    <summary class="small muted" th:text="${#strings.isEmpty(a.note())} ? '메모 달기' : '메모 고치기'">메모</summary>
                    <form method="post" th:action="|/rules/${row.id()}/art/${a.id()}/note|" data-write="1" style="margin-top:8px">
                        <label class="field grow">메모<textarea name="text" rows="4" maxlength="20000" th:text="${a.note()}" data-rich="html" th:attr="data-html=${a.noteHtml()}"></textarea></label>
                        <p style="margin-top:6px"><button type="submit" class="btn">메모 저장</button></p>
                    </form>
                    <form th:if="${!#strings.isEmpty(a.note())}" method="post" th:action="|/rules/${row.id()}/art/${a.id()}/note|" data-write="1"
                          class="inline-form note-del" th:data-confirm="|${a.label()}의 메모를 지울까요? 되돌릴 수 없습니다.|">
                        <input type="hidden" name="text" value="" />
                        <button type="submit" class="btn btn-quiet danger-text">메모 삭제</button>
                    </form>
                </details>
            </article>
        </th:block>
        <th:block th:if="${!#lists.isEmpty(m.gone)}">
            <h2 class="chap">이번 판에서 삭제된 조</h2>
            <article class="art gone" th:each="a : ${m.gone}">
                <header><h3 th:text="${a.label()}"></h3><span class="dtag del">삭제</span></header>
                <div class="abody" th:utext="${a.html()}"></div>
            </article>
        </th:block>
        <p class="empty" th:if="${#lists.isEmpty(m.items)}">조문이 없습니다.</p>
    </div>
    <nav class="reg-toc" aria-label="목차">
        <strong>목차</strong>
        <th:block th:each="a : ${m.items}">
            <div class="tch" th:if="${a.newChapter()}" th:text="${a.chapter()}"></div>
            <a th:href="|#a-${a.id()}|" th:text="${a.label()}" th:title="${a.label()}"></a>
        </th:block>
    </nav>
</div>
<div th:replace="~{link-parts :: linked('rule', ${row.id()}, ${linkedCases}, ${caseChoices})}"></div>
</div>
<dialog id="meta-dialog" aria-labelledby="meta-title">
    <div class="dialog-head"><h2 id="meta-title">사규 정보</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <form method="post" th:action="|/rules/${row.id()}/meta|" data-write="1">
        <div class="form-grid">
            <label class="field grow">사규 이름<input name="title" required maxlength="120" th:value="${row.title()}" /></label>
            <label class="field">카테고리<select name="categoryId"><option value="">미분류</option><option th:each="c : ${cats}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == r.categoryId}"></option></select></label>
            <label class="field">상태<select name="status">
                <option value="active" th:selected="${row.status() == 'active'}">시행 중</option>
                <option th:each="s : ${ {'개정 예정','검토 중','폐지'} }" th:value="${s}" th:text="${s}" th:selected="${row.status() == s}"></option>
            </select></label>
            <label class="field">주관부서<input name="owner" list="dl-orgs" autocomplete="off" maxlength="60" th:value="${row.owner()}" placeholder="예: 인사팀" /></label>
            <label class="field"><span class="flabel">검토 주기(개월) <span class="field-note">비우면 검토 알림 없음</span></span><input name="reviewMonths" type="number" min="0" max="120" th:value="${row.reviewMonths() > 0 ? row.reviewMonths() : ''}" placeholder="예: 12" /></label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>
    <h3 style="margin:18px 0 8px;font-size:14px">판</h3>
    <div th:each="x : ${m.versions}" class="inline-row">
        <form method="post" th:action="|/rules/${row.id()}/version/${x.id}/label|" data-write="1" class="inline-form inline-row">
            <label class="field">판 이름<input name="label" required maxlength="60" th:value="${x.label}" /></label>
            <label class="field">시행일<input name="effectiveDate" type="date" th:value="${#strings.substring(x.effectiveDate + '          ', 0, 10).trim()}" /></label>
            <button type="submit" class="btn">저장</button>
        </form>
        <form method="post" th:action="|/rules/${row.id()}/version/${x.id}/current|" data-write="1" th:if="${x.id != r.currentVersionId}"><button type="submit" class="btn">지금 판으로</button></form>
        <form method="post" th:action="|/rules/${row.id()}/version/${x.id}/delete|" data-write="1" th:data-confirm="|${x.label} 판을 지울까요? 되돌릴 수 없습니다.|" th:if="${#lists.size(m.versions) > 1}"><button type="submit" class="btn btn-quiet">판 지우기</button></form>
    </div>
    <h3 style="margin:18px 0 8px;font-size:14px">사규 지우기</h3>
    <form method="post" th:action="|/rules/${row.id()}/delete|" data-write="1" th:data-confirm="|「${row.title()}」를 지울까요? 모든 판과 메모·북마크가 함께 지워집니다.|">
        <p class="hint">모든 판과 이 사규에 단 메모·북마크가 함께 지워집니다. 되돌릴 수 없습니다.</p>
        <button type="submit" class="btn btn-danger">사규 지우기</button>
    </form>
</dialog>
</th:block>
</th:block>
</body>
</html>
