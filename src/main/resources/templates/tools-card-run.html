<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>점검 결과 · 법인카드 점검</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1 th:text="${run.Title}">점검 결과</h1>
        <p class="hint" th:text="|${run.FileName} · 점검 ${run.CheckedAt == null ? '' : #strings.substring(run.CheckedAt, 0, 16).replace('T', ' ')}${#strings.isEmpty(run.Note) ? '' : ' · ' + run.Note}|"></p>
    </div>
    <div class="row-actions no-print">
        <a class="btn" th:href="|/tools/card/${run.Id}/export|">결과 내려받기 (CSV)</a>
        <a class="btn" th:href="|/tools/card/${run.Id}/export?all=1|">전체 내려받기</a>
        <form method="post" th:action="|/tools/card/${run.Id}/recheck|" data-write="1" class="inline-form"><button type="submit" class="btn">다시 점검</button></form>
    </div>
</div>
<div class="hitbar no-print" id="hitbar">
    <form method="get" th:action="|/tools/card/${run.Id}#hits|" class="toolbar">
        <div class="search-row">
            <label class="search"><span class="sr">찾기</span>
                <input name="q" th:value="${q['q']}" placeholder="가맹점·사용내역·이름·사유로 찾기" aria-label="찾기" maxlength="80" /></label>
            <button class="btn btn-primary" type="submit">찾기</button>
        </div>
        <label class="field"><span class="sr-only">규칙</span><select name="rule" data-autosubmit><option value="">규칙 전체</option>
            <option th:each="r : ${RULES}" th:value="${r.key}" th:text="${r.value}" th:selected="${q['rule'] == r.key}"></option></select></label>
        <label class="field"><span class="sr-only">부서</span><select name="dept" data-autosubmit><option value="">부서 전체</option>
            <option th:each="d : ${depts}" th:value="${d}" th:text="${d}" th:selected="${q['dept'] == d}"></option></select></label>
        <label class="field"><span class="sr-only">이름</span><select name="name" data-autosubmit><option value="">이름 전체</option>
            <option th:each="n : ${names}" th:value="${n}" th:text="${n}" th:selected="${q['name'] == n}"></option></select></label>
        <label class="field"><span class="sr-only">처리</span><select name="status" data-autosubmit><option value="">처리 전체</option><option value="open" th:selected="${q['status'] == 'open'}">처리 안 된 건</option>
            <option th:each="st : ${STATUSES}" th:value="${st}" th:text="${st}" th:selected="${q['status'] == st}"></option></select></label>
        <label class="field"><span class="sr-only">점수</span><select name="min" data-autosubmit>
            <option value="20" th:selected="${q['min'] == '20'}">20점 이상 (확인 대상)</option>
            <option value="40" th:selected="${q['min'] == '40'}">40점 이상 (높음)</option>
            <option value="1" th:selected="${q['min'] == '1'}">전체 (낮음 포함)</option></select></label>
        <a class="btn" th:href="|/tools/card/${run.Id}#hits|">조건 지우기</a>
    </form>
    <form id="card-pick" method="post" th:action="|/tools/card/${run.Id}/analyze|" data-write="1" class="pickbar">
        <span>목록에서 건을 고른 뒤</span>
        <select name="setId" aria-label="분석에 넣을 곳" th:if="${!#lists.isEmpty(sets)}">
            <option value="">새 상세 분석 만들기</option>
            <option th:each="x : ${sets}" th:value="${x.Id}" th:text="|${x.Title}에 더하기|"></option>
        </select>
        <button type="submit" class="btn btn-primary" data-pick-count>고른 건 상세 분석</button>
        <span class="muted small">고른 건만 따로 모아 연결고리·엑셀 장표로 깊게 보고, 조사할 문제 건을 정리합니다.</span>
    </form>
</div>
<ul class="metrics">
    <li class="metric-ok"><a th:href="|/tools/card/${run.Id}?min=1#hits|"><span class="metric-top" th:text="|사용내역 · ${#numbers.formatInteger(s.total.Amt, 1, 'COMMA')}원|">사용내역</span>
        <strong th:text="|${#numbers.formatInteger(s.total.N, 1, 'COMMA')}건|">0</strong></a></li>
    <li class="metric-warn"><a th:href="|/tools/card/${run.Id}#hits|"><span class="metric-top" th:text="|확인 대상 (20점 이상) · ${#numbers.formatInteger(s.hit.Amt ?: 0, 1, 'COMMA')}원|">확인 대상</span>
        <strong th:text="|${s.hit.N ?: 0}건|">0</strong></a></li>
    <li class="metric-bad"><a th:href="@{|/tools/card/${run.Id}|(min=40)} + '#hits'"><span class="metric-top">위험 높음 (40점 이상)</span><strong th:text="|${s.hit.High ?: 0}건|">0</strong></a></li>
    <li class="metric-warn"><a th:href="@{|/tools/card/${run.Id}|(status='open')} + '#hits'"><span class="metric-top">확인 대상 중 처리 안 된 건</span><strong th:text="|${s.hit.Open ?: 0}건|">0</strong></a></li>
</ul>
<p class="hint" th:if="${s.hit.Low != null and s.hit.Low > 0}" th:text="|약한 신호 하나만 있는 낮은 점수(20점 미만) ${s.hit.Low}건은 기본 목록에서 뺐습니다. 위 '점수: 전체'로 볼 수 있습니다.|"></p>
<div class="cols-2">
    <section class="card">
        <div class="card-head"><h2>규칙별 <span class="sub">누르면 그 규칙에 걸린 건만</span></h2></div>
        <p class="empty" th:if="${#lists.isEmpty(s.byRule)}">걸린 건이 없습니다.</p>
        <div class="rule-chips" th:unless="${#lists.isEmpty(s.byRule)}">
            <a th:each="r : ${s.byRule}" th:href="@{|/tools/card/${run.Id}|(rule=${r.Rule},min=1)} + '#hits'" th:classappend="${q['rule'] == r.Rule} ? 'on'">
                <span th:text="${r.Label}"></span><b th:text="${r.N}"></b><small th:if="${r.Ex > 0}" th:text="|예외 ${r.Ex}|"></small></a>
        </div>
    </section>
    <section class="card">
        <div class="card-head"><h2>사람별 <span class="sub" th:text="|점수 합 상위 ${#lists.size(topPeople)}명 · 전체 ${#lists.size(s.people)}명|"></span></h2>
            <a class="btn" th:href="|/tools/card/${run.Id}/people|" target="_blank" rel="noopener">사람별 전체 보기 ↗</a></div>
        <ul class="people-top">
            <li th:each="p : ${topPeople}">
                <a th:href="@{|/tools/card/${run.Id}|(name=${p.Name})} + '#hits'" th:text="${p.Name}"></a>
                <span class="muted" th:text="|${p.Dept} · ${p.N}건 · ${#numbers.formatInteger(p.Amt, 1, 'COMMA')}원 · 확인 대상 ${p.HitN}건${p.Repeat > 0 ? ' · 지난 회차 ' + p.Repeat + '회' : ''}|"></span>
                <span class="pill" th:classappend="${p.Score >= 40} ? 'bad' : (${p.Score >= 20} ? 'warn' : '')" th:text="|${p.Score}점|"></span>
            </li>
        </ul>
    </section>
</div>
<section class="card" th:unless="${#lists.isEmpty(sets)}">
    <div class="card-head"><h2>상세 분석 <span class="sub" th:text="|${#lists.size(sets)}개|"></span></h2></div>
    <ul class="set-list">
        <li th:each="x : ${sets}">
            <a th:href="|/tools/card-analysis/${x.Id}|" th:text="${x.Title}"></a>
            <span class="muted" th:text="|${x.N}건 · 문제 ${x.Bad} · 소명 필요 ${x.Ask} · 검토 중 ${x.Open}|"></span>
        </li>
    </ul>
</section>
<p class="count-line" id="hits" th:text="|${v.total}건 · ${#numbers.formatInteger(v.amount, 1, 'COMMA')}원 · ${v.page}/${v.pages}쪽|"></p>
<p class="empty" th:if="${v.total == 0}">조건에 맞는 건이 없습니다.</p>
<div class="table-wrap" th:unless="${v.total == 0}">
    <table class="data card-hits">
        <thead><tr>
            <th scope="col" class="no-print"><input type="checkbox" data-check-all="tx" aria-label="모두 고르기" form="card-pick" /></th>
            <th scope="col" class="num">점수</th><th scope="col">점검 사유</th><th scope="col">사람</th><th scope="col">일시</th><th scope="col">가맹점</th>
            <th scope="col" class="num">금액</th><th scope="col">사용내역</th><th scope="col">처리</th><th scope="col" class="no-print"></th>
        </tr></thead>
        <tbody>
        <tr th:each="t : ${v.items}">
            <td class="no-print"><input type="checkbox" name="tx" th:value="${t.Id}" form="card-pick" aria-label="고르기" /></td>
            <td class="num"><span class="pill" th:classappend="${t.Score >= 40} ? 'bad' : (${t.Score >= 20} ? 'warn' : '')" th:text="${t.Score}"></span>
                <div class="small muted" th:text="${t.Level}"></div></td>
            <td class="reasons" th:text="${t.Reasons}"></td>
            <td class="nowrap"><strong th:text="${t.Name}"></strong><div class="small muted" th:text="${t.Dept}"></div></td>
            <td class="nowrap" th:text="|${t.TxDate} ${#strings.length(t.TxTime) >= 5 ? #strings.substring(t.TxTime, 0, 5) : ''}|"></td>
            <td><span th:text="${t.Merchant}"></span><div class="small muted" th:text="${t.Industry} + (${#strings.isEmpty(t.BizType)} ? '' : ' · ' + ${t.BizType})"></div></td>
            <td class="num nowrap" th:text="${#numbers.formatInteger(t.Amount, 1, 'COMMA')}"></td>
            <td class="small" th:text="${t.Purpose}"></td>
            <td class="review-cell">
                <form method="post" action="/tools/card/review" data-write="1" class="review-form">
                    <input type="hidden" name="key" th:value="${t.TxKey}" />
                    <select name="status" aria-label="처리 상태"><option value="">미처리</option>
                        <option th:each="st : ${STATUSES}" th:value="${st}" th:text="${st}" th:selected="${t.Status == st}"></option></select>
                    <input name="note" th:value="${t.ReviewNote}" placeholder="소명·확인 메모" maxlength="1000" aria-label="메모" />
                    <button type="submit" class="btn btn-quiet no-print">저장</button>
                </form>
            </td>
            <td class="no-print">
                <details class="ex-menu"><summary class="btn btn-quiet">예외</summary>
                    <form method="post" action="/tools/card/exception" data-write="1" class="ex-form">
                        <input type="hidden" name="tx" th:value="${t.Id}" />
                        <input type="hidden" name="back" th:value="|/tools/card/${run.Id}#hits|" />
                        <label class="field">범위<select name="scope">
                            <option value="personDate" th:text="|${t.Name} · ${t.TxDate} (휴일근무·출장 등)|"></option>
                            <option value="shop" th:text="|가맹점 ${t.Merchant}|"></option>
                            <option value="person" th:text="|${t.Name} (규칙을 골라야 함)|"></option></select></label>
                        <label class="field">규칙<select name="rule"><option value="">모든 규칙</option>
                            <option th:each="r : ${t.RuleList}" th:value="${r}" th:text="${RULES[r]}"></option></select></label>
                        <label class="field">사유<input name="note" maxlength="300" placeholder="예: 휴일근무명령서 확인" /></label>
                        <button type="submit" class="btn btn-primary">예외 등록</button>
                    </form>
                </details>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<p class="row-actions no-print" th:if="${v.pages > 1}">
    <a class="btn" th:if="${v.page > 1}" th:href="@{|/tools/card/${run.Id}|(page=${v.page - 1},rule=${q['rule']},dept=${q['dept']},name=${q['name']},status=${q['status']},min=${q['min']},q=${q['q']})} + '#hits'">← 앞쪽</a>
    <a class="btn" th:if="${v.page < v.pages}" th:href="@{|/tools/card/${run.Id}|(page=${v.page + 1},rule=${q['rule']},dept=${q['dept']},name=${q['name']},status=${q['status']},min=${q['min']},q=${q['q']})} + '#hits'">뒤쪽 →</a>
</p>
<div th:replace="~{link-parts :: linked('card', ${run.Id}, ${linkedCases}, ${caseChoices})}"></div>
<p class="row-actions no-print" style="margin-top:20px">
    <form method="post" th:action="|/tools/card/${run.Id}/delete|" data-write="1" th:data-confirm="|'${run.Title}' 회차를 지울까요? 소명·예외 기록은 남습니다.|">
        <button type="submit" class="btn btn-quiet">이 회차 지우기</button></form>
</p>
</th:block>
</body>
</html>
