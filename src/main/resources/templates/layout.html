<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title th:replace="${title}">감사기록</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/local.css" />
    <link rel="icon" type="image/png" href="/icons/app.png" />
</head>
<body th:classappend="${integrityOk} ? '' : 'frozen-integrity'">
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <aside class="side" id="app-nav">
        <a class="brand" href="/todo">
            <span class="brand-mark" aria-hidden="true">감</span>
            <span>감사기록</span>
        </a>
        <form method="get" action="/search" class="side-search" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input name="q" th:value="${searchQuery}" placeholder="전체 찾기" maxlength="120" autocomplete="off" spellcheck="false" aria-label="전체 찾기" data-global-search />
            <kbd>Ctrl K</kbd>
        </form>
        <nav id="menu" aria-label="업무 화면">
            <p class="side-label">업무</p>
            <a href="/todo" th:aria-current="${nav == 'todo'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>할 일</span></a>
            <a href="/inbox" th:aria-current="${nav == 'inbox'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5 6.5 5h11L20 13.5V19H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13.5h5a3 3 0 0 0 6 0h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>수집함</span><span class="count" th:if="${inboxPending > 0}" th:text="${inboxPending}">0</span></a>
            <a href="/cases" th:aria-current="${nav == 'cases'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9h6M9 13h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>건 목록</span></a>
            <a href="/files" th:aria-current="${nav == 'files'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h6l2 2h8v9H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>자료</span></a>
            <a href="/discipline" th:aria-current="${nav == 'discipline'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 19c.8-3.2 3.3-5 6.5-5s5.700 1.800 6.500 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>징계기록</span></a>
            <p class="side-label">프로그램</p>
            <a href="/admin" th:aria-current="${nav == 'admin'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.500 19 6.500v5c0 4.300-2.900 7.400-7 9-4.100-1.600-7-4.700-7-9v-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>관리</span></a>
            <a href="/settings" th:aria-current="${nav == 'settings'} ? 'page'"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.500v3M12 17.500v3M3.500 12h3M17.500 12h3M6 6l2.100 2.100M15.900 15.900 18 18M18 6l-2.100 2.100M8.100 15.900 6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>설정</span></a>
        </nav>
        <div class="side-end">
            <div class="theme" role="group" aria-label="화면 테마">
                <button type="button" class="theme-btn" data-theme-set="light" aria-pressed="false" aria-label="라이트" title="라이트">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="theme-btn" data-theme-set="dark" aria-pressed="false" aria-label="다크" title="다크">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3.5a8.2 8.2 0 1 0 5.5 14.2A7 7 0 0 1 15 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="theme-btn" data-theme-set="system" aria-pressed="false" aria-label="시스템" title="시스템">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 19.5h6M12 16v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
            </div>
            <a class="user-menu-link" href="/settings" title="설정">
                <span class="avatar" aria-hidden="true" th:text="${ownerInitial}">나</span>
                <span class="who"><strong th:text="${ownerName}">나</strong><span>이 컴퓨터 전용</span></span>
            </a>
        </div>
    </aside>
    <div class="workspace">
        <main id="main">
            <div class="banner danger" role="alert" th:unless="${integrityOk}">
                <strong>이력 훼손 — 기록의 신뢰성을 확인할 수 없습니다.</strong>
                데이터 파일이 직접 고쳐졌을 수 있습니다. 변경은 멈췄습니다. <a href="/admin#integrity">관리 화면</a>에서 조사 사유를 남기고 해제합니다.
            </div>
            <p class="banner info" role="status" th:if="${flash}" th:text="${flash}"></p>
            <th:block th:replace="${content}" />
        </main>
        <footer class="foot">
            <p>이 컴퓨터에서만 열립니다 · 화면 시각 <span th:text="${nowDisplay}"></span> KST</p>
        </footer>
    </div>
    <div class="toasts" aria-live="polite" aria-relevant="additions"></div>
    <dialog id="preview-dialog" aria-labelledby="preview-title">
        <div class="dialog-head">
            <span class="file-ico ico-file" id="preview-ico" aria-hidden="true">FILE</span>
            <div>
                <h2 id="preview-title">미리보기</h2>
                <p class="hint" id="preview-meta"></p>
            </div>
            <a class="btn" id="preview-download">내려받기</a>
            <button type="button" class="icon-btn" data-close aria-label="닫기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>
        <p class="hint preview-note">암호화된 원문은 화면에서 펼치지 않습니다. '열기'로 이 컴퓨터의 프로그램에서 엽니다.</p>
        <iframe id="preview-frame" title="미리보기" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
        <img id="preview-img" alt="" hidden>
    </dialog>
    <script src="/js/site.js" defer></script>
</body>
</html>
