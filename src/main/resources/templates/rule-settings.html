<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>사규 설정 · 사규</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1>사규 설정</h1>
        <p class="hint" th:text="|사규 ${stats.regs}건 · 조문 ${stats.articles}개 · 데이터는 Portal의 데이터 파일 하나에 함께 저장되고, 관리 화면의 백업에 함께 들어갑니다.|"></p>
    </div>
</div>
<section class="card" id="import">
    <h2>백업·옮겨 오기·내려받기</h2>
    <p class="hint">사규 자료는 프로그램 전체 백업에 함께 들어갑니다. 백업, 백업에서 되돌리기, 예전 프로그램 파일 옮겨 오기는 설정의 <strong>백업·복원·옮기기</strong> 한 곳에서 합니다.</p>
    <p class="row-actions"><a class="btn btn-primary" href="/import">백업·복원·옮기기 열기</a> <a class="btn" href="/rules/data/export">사규 JSON 내려받기</a></p>
</section>
<section class="card">
    <h2>동의어 사전</h2>
    <p class="hint">같은 뜻으로 쓰는 회사 말을 묶어 두면 사규 찾기와 상황 질의가 함께 찾습니다. 예) 겸직, 부업, 투잡</p>
    <div class="inline-row" th:each="g : ${synonyms}">
        <span class="wide" th:text="${#strings.listJoin(g.words, ', ')}" style="flex:1 1 300px"></span>
        <form method="post" action="/rules/settings/synonym/delete" data-write="1"><input type="hidden" name="id" th:value="${g.id}" /><button type="submit" class="btn btn-quiet">지우기</button></form>
    </div>
    <form method="post" action="/rules/settings/synonym/add" data-write="1" class="inline-form inline-row" style="margin-top:10px">
        <label class="field wide">새 묶음 (쉼표로 나눔)<input name="words" required maxlength="300" placeholder="겸직, 부업, 투잡" /></label>
        <button type="submit" class="btn btn-primary">더하기</button>
    </form>
    <details style="margin-top:10px"><summary class="small muted" th:text="|기본으로 들어 있는 묶음 ${#lists.size(builtin)}개|"></summary>
        <div class="small muted" th:each="g : ${builtin}" th:text="${#strings.listJoin(g, ', ')}"></div></details>
</section>
<section class="card">
    <h2>카테고리</h2>
    <p class="hint">순서는 숫자가 작은 것이 앞입니다. 카테고리를 지우면 그 사규는 미분류가 됩니다.</p>
    <div th:each="c : ${cats}" class="inline-row">
        <form method="post" action="/rules/settings/category/save" data-write="1" class="inline-form inline-row">
            <input type="hidden" name="id" th:value="${c.id}" />
            <label class="field">이름<input name="name" required maxlength="40" th:value="${c.name}" /></label>
            <label class="field">순서<input name="order" type="number" min="0" max="999" th:value="${c.order}" style="width:90px" /></label>
            <button type="submit" class="btn">저장</button>
        </form>
        <form method="post" action="/rules/settings/category/delete" data-write="1" th:data-confirm="|카테고리 '${c.name}'를 지울까요? 그 사규는 미분류가 됩니다.|"><input type="hidden" name="id" th:value="${c.id}" /><button type="submit" class="btn btn-quiet">지우기</button></form>
    </div>
    <form method="post" action="/rules/settings/category/save" data-write="1" class="inline-form inline-row" style="margin-top:14px">
        <label class="field">새 카테고리<input name="name" required maxlength="40" /></label>
        <label class="field">순서<input name="order" type="number" min="0" max="999" style="width:90px" /></label>
        <button type="submit" class="btn btn-primary">더하기</button>
    </form>
</section>
</th:block>
</body>
</html>
