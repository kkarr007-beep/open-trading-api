<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>실적 입력 · 경영현황</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <p class="kicker">경영현황</p>
        <h1 th:text="|실적 입력 — ${date}|">실적 입력</h1>
        <p class="hint" th:text="|일별 지표는 ${date}에, 주간 지표는 ${weekLabel} 주에 저장합니다. ${pending[0] + pending[1] > 0 ? '아직 ' + pending[0] + '개(일별)' + (pending[1] > 0 ? ', ' + pending[1] + '개(주간)' : '') + ' 남았습니다.' : '이 날짜는 모두 입력했습니다.'}|"></p>
    </div>
    <div class="row-actions no-print">
        <form method="get" action="/board/entry" class="inline-form"><label class="field"><span class="sr">입력 날짜</span><input type="date" name="date" th:value="${date}" data-autosubmit aria-label="입력 날짜" /></label></form>
        <form method="post" action="/board/entry/prev" data-write="1" class="inline-form"><input type="hidden" name="date" th:value="${date}" />
            <button type="submit" class="btn" th:title="|${prevDay} 값으로 빈칸을 채웁니다|">전 영업일 값 채우기</button></form>
        <a class="btn" th:href="@{/board(p='d',date=${date})}">이 날 현황</a>
        <button type="submit" form="entry-form" class="btn btn-primary">실적 저장</button>
    </div>
</div>
<section class="card" th:if="${pasteRows != null}">
    <h2>붙여 넣은 내용 <span class="sub" th:text="|${#maps.size(filled)}개를 아래 칸에 채웠습니다. 확인 후 '실적 저장'을 누르세요.|"></span></h2>
    <div class="table-wrap"><table class="data small">
        <thead><tr><th scope="col">확인</th><th scope="col">붙여 넣은 줄</th><th scope="col">처리</th></tr></thead>
        <tbody><tr th:each="x : ${pasteRows}"><td><span class="pill" th:classappend="${x.ok()} ? 'ok' : 'bad'" th:text="${x.ok()} ? '채움' : '못 찾음'"></span></td>
            <td class="muted" th:text="${x.src()}"></td><td th:text="${x.why()}"></td></tr></tbody>
    </table></div>
</section>
<form id="entry-form" method="post" action="/board/entry" data-write="1">
    <input type="hidden" name="date" th:value="${date}" />
    <section class="card bd-entry" th:each="o : ${d.orgs}" th:if="${byOrg.containsKey(o.id)}" th:with="ks=${byOrg[o.id]}">
        <h2 th:text="${o.name}"></h2>
        <div class="table-wrap"><table class="data">
            <thead><tr><th scope="col">지표</th><th scope="col">구분</th><th scope="col" class="num">실적</th><th scope="col" class="num">목표</th><th scope="col">상태</th></tr></thead>
            <tbody><tr th:each="k : ${ks}" th:classappend="${filled.containsKey(k.id)} ? 'pasted'">
                <th scope="row" th:text="${k.name}"></th>
                <td class="small muted" th:text="|${k.grpName()} · ${k.calcName()}${k.weekly() ? ' · 주간' : ''}|"></td>
                <td class="num"><span class="bd-inwrap"><input class="bd-in" type="number" step="any" inputmode="decimal" th:name="|v_${k.id}|" th:value="${values[k.id]}" placeholder="숫자" th:aria-label="|${o.name} ${k.name}|" /><span class="u" th:text="${k.uom}"></span></span></td>
                <td class="num small" th:text="${c.num(k.target, k.uom)} + (${k.weekly()} ? ' / 주' : '')"></td>
                <td><span class="pill" th:classappend="${values.containsKey(k.id)} ? 'ok' : ''" th:text="${filled.containsKey(k.id)} ? '붙여 넣음' : (${values.containsKey(k.id)} ? '입력' : '—')"></span></td>
            </tr></tbody>
        </table></div>
    </section>
    <p class="row-actions bd-save"><button type="submit" class="btn btn-primary">실적 저장</button>
        <span class="hint" style="margin:0">칸을 비우고 저장하면 그 값만 지웁니다.</span></p>
</form>
<div class="card-split">
    <section class="card">
        <h2>엑셀에서 붙여 넣기 <span class="sub">'지표 이름 · 값' 줄 · 조직 이름이 앞에 있어도 됩니다</span></h2>
        <form method="post" action="/board/entry/paste" data-write="1">
            <input type="hidden" name="date" th:value="${date}" />
            <textarea name="text" rows="6" class="textarea-wide mono" aria-label="붙여 넣을 실적" placeholder="생산성&#9;97&#10;고객2 사업부 S/L 지표&#9;88.5&#10;IVR 수신율 (장기물)&#9;93" th:text="${pasteText}"></textarea>
            <p class="row-actions" style="margin-top:8px"><button type="submit" class="btn">칸에 채우기</button></p>
        </form>
    </section>
    <section class="card">
        <h2>이 날 일별 실적 지우기</h2>
        <p class="hint">잘못 넣은 날의 일별 값만 모두 지웁니다. 주간 지표는 남습니다.</p>
        <form method="post" action="/board/entry/clear" data-write="1" th:data-confirm="|${date}의 일별 실적을 모두 지울까요?|">
            <input type="hidden" name="date" th:value="${date}" /><button type="submit" class="btn btn-danger">일별 실적 지우기</button></form>
    </section>
</div>
</th:block>
</body>
</html>
