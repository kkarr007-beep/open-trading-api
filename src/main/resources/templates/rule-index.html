<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>전체 목차 · 사규</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1>전체 목차</h1>
        <p class="hint" th:text="|사규 ${stats.regs}건 · 조 ${stats.articles}개. 사규 이름·조 번호·조 제목·본문으로 추릴 수 있습니다.|"></p>
    </div>
</div>
<form method="get" action="/rules/index" class="toolbar" style="margin-bottom:14px">
    <div class="search-row">
        <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="sr">목차 추리기</span>
            <input name="q" th:value="${q}" placeholder="예: 징계, 5조, 음주" maxlength="80" data-search-focus />
        </label>
        <button class="btn btn-primary" type="submit">추리기</button>
        <a class="btn" href="/rules/index" th:unless="${#strings.isEmpty(q)}">모두 보기</a>
    </div>
</form>
<p class="empty" th:if="${#lists.isEmpty(groups)}">맞는 사규가 없습니다.</p>
<section th:each="g : ${groups}">
    <h2 th:text="${g.name()}"></h2>
    <details class="mi-reg" th:each="r : ${g.regs()}" open>
        <summary><strong th:text="${r.reg().title()}"></strong>
            <span class="small muted" th:text="|${r.reg().articles()}개 조 · ${r.reg().label()} · 시행 ${r.reg().effectiveDate()}${#strings.isEmpty(q) ? '' : ' · 맞는 조 ' + r.hits()}|"></span></summary>
        <div class="mi-list">
            <th:block th:each="a : ${r.arts()}">
                <div class="ch" th:if="${a.newChapter()}" th:text="${a.chapter()}"></div>
                <a th:href="@{|/rules/${r.reg().id()}|(q=${q})} + '#a-' + ${a.id()}" th:title="|${a.number()} ${a.title()}|"><strong th:text="${a.number()}"></strong> <span th:text="${a.title()}"></span></a>
            </th:block>
        </div>
    </details>
</section>
</th:block>
</body>
</html>
