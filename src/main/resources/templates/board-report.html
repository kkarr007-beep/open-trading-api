<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>보고 문구 · 경영현황</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <p class="kicker">경영현황</p>
        <h1>보고 문구</h1>
        <p class="hint">고른 기간의 종합 달성률, 사업부별 현황, 계획 이탈 지표, 진행 중 이슈, 집중 사항, 주간 지표를 보고서 문장(□ - ·)으로 정리합니다. 복사해 메일·보고서에 붙여 넣으세요.</p>
    </div>
    <div class="row-actions no-print">
        <button type="button" class="btn" th:attr="data-copy=${text}">복사</button>
        <a class="btn" th:href="@{/board/report/export(p=${period},date=${date})}">글 파일 내려받기</a>
    </div>
</div>
<div th:replace="~{board-parts :: periodbar('/board/report')}"></div>
<section class="card"><pre class="bd-report" th:text="${text}"></pre></section>
</th:block>
</body>
</html>
