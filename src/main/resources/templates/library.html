<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>자료 · Portal</title></head>
<body>
<th:block id="content">
<div id="lib-root" th:attr="data-folder=${uploadTo},data-current=${f}">
<div class="ex-head">
    <div>
        <nav class="ex-path" aria-label="폴더 위치">
            <a href="/library">자료</a>
            <th:block th:each="t, ts : ${trail}"><span class="sep">›</span>
                <a th:href="@{/library(f=${t.id})}" th:text="${t.name}" th:classappend="${ts.last} ? 'here'" data-drop-folder th:attr="data-folder-id=${t.id}"></a></th:block>
            <th:block th:if="${view == 'star'}"><span class="sep">›</span><b>즐겨찾기</b></th:block>
            <th:block th:if="${view == 'recent'}"><span class="sep">›</span><b>최근 연 자료</b></th:block>
        </nav>
        <h1 th:text="${view == 'star'} ? '즐겨찾기' : (${view == 'recent'} ? '최근 연 자료' : (${cur == null} ? '모든 자료' : ${cur.name}))">자료</h1>
    </div>
    <div class="acts no-print">
        <button type="button" class="btn" data-folder-new th:attr="data-parent=${cur == null ? '' : cur.id}" th:if="${view == '' and (cur == null or cur.depth < 3)}">새 폴더</button>
        <button type="button" class="btn btn-primary" data-upload-toggle>파일 올리기</button>
    </div>
</div>

<section class="up card" id="upload" th:classappend="${param.upload != null or (v.total == 0 and #lists.isEmpty(subFolders) and view == '' and #strings.isEmpty(q))} ? 'open'">
    <form method="post" action="/library/upload" data-write="1" data-reload enctype="multipart/form-data" id="upload-form">
        <input type="hidden" name="back" th:value="@{/library(f=${uploadTo})}" />
        <div class="dz2" data-dropzone>
            <strong>여기에 파일을 끌어 놓거나 눌러서 고르세요</strong>
            <small th:text="|'${uploadToName}' 폴더에 올라갑니다 · 여러 개 가능 · 같은 파일은 건너뜁니다|"></small>
            <input type="file" name="upload" multiple required aria-label="올릴 파일" />
            <span class="drop-name" data-file-name hidden></span>
        </div>
        <div class="up-row">
            <label class="field"><span class="flabel">올릴 폴더</span>
                <select name="categoryId" required>
                    <option th:each="x : ${allFolders}" th:value="${x.id}" th:selected="${x.id == uploadTo}"
                            th:text="${(x.depth == 1 ? '' : (x.depth == 2 ? '　└ ' : '　　└ ')) + x.name}"></option>
                </select></label>
            <label class="field grow"><span class="flabel">태그 (쉼표로 나눔 · 아래 칩을 눌러 넣기)</span>
                <input name="tags" maxlength="300" placeholder="예: 2026, 경영지원팀, 지침" data-tag-input /></label>
            <button type="submit" class="btn btn-primary">올리기</button>
        </div>
        <div class="tag-picks" th:unless="${#lists.isEmpty(uploadTags) and #lists.isEmpty(orgNames)}">
            <button type="button" class="tag" th:each="t : ${uploadTags}" th:text="${t.key}" data-tag-pick></button>
            <button type="button" class="tag ghost-tag" th:each="o : ${orgNames}" th:if="${oStat.index < 6}" th:text="${o}" data-tag-pick></button>
        </div>
    </form>
</section>

<form method="get" action="/library" class="ex-find" role="search">
    <input type="hidden" name="f" th:value="${f}" />
    <input type="hidden" name="view" th:value="${view}" />
    <input type="hidden" name="tag" th:value="${tag}" />
    <input type="hidden" name="kind" th:value="${kind}" />
    <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input name="q" th:value="${q}" placeholder="제목·파일 이름·태그·메모·문서 내용으로 찾기" maxlength="120" aria-label="자료 찾기" data-search-focus />
    </label>
    <span class="seg2" th:if="${cur != null and view == ''}" role="radiogroup" aria-label="찾는 범위">
        <label><input type="radio" name="scope" value="here" th:checked="${scope != 'all'}" data-autosubmit /><span>이 폴더</span></label>
        <label><input type="radio" name="scope" value="all" th:checked="${scope == 'all'}" data-autosubmit /><span>전체</span></label>
    </span>
    <select name="sort" data-autosubmit aria-label="정렬">
        <option value="" th:selected="${sort == ''}" th:text="${view == 'recent'} ? '최근 연 순' : '최근 올린 순'">최근 올린 순</option>
        <option value="old" th:selected="${sort == 'old'}">오래된 순</option>
        <option value="title" th:selected="${sort == 'title'}">제목 순</option>
        <option value="size" th:selected="${sort == 'size'}">큰 파일 순</option>
    </select>
    <button class="btn btn-primary" type="submit">찾기</button>
    <button type="button" class="btn no-print" data-save-search th:if="${!#strings.isEmpty(q) or !#strings.isEmpty(tag) or !#strings.isEmpty(kind)}">이 찾기 저장</button>
    <a class="btn" th:unless="${#strings.isEmpty(q) and #strings.isEmpty(tag) and #strings.isEmpty(kind)}" th:href="@{/library(f=${f},view=${view})}">조건 지우기</a>
</form>
<div class="chiprow" th:if="${!#lists.isEmpty(v.tags) or v.total > 0}">
    <th:block th:unless="${#lists.isEmpty(v.tags)}">
        <span class="chip-label">태그</span>
        <a class="tag" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},kind=${kind},sort=${sort})}" th:classappend="${#strings.isEmpty(tag)} ? 'on'">전체</a>
        <a class="tag" th:each="t : ${v.tags}" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},kind=${kind},sort=${sort},tag=${t.key})}"
           th:classappend="${tag == t.key} ? 'on'" th:text="|#${t.key} ${t.value}|"></a>
    </th:block>
    <span class="chip-label">형식</span>
    <a class="tag" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},tag=${tag},sort=${sort})}" th:classappend="${#strings.isEmpty(kind)} ? 'on'">전체</a>
    <th:block th:each="k : ${KINDS}"><a class="tag" th:if="${v.kinds[k.key] > 0}" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},tag=${tag},sort=${sort},kind=${k.key})}"
       th:classappend="${kind == k.key} ? 'on'" th:text="|${k.value} ${v.kinds[k.key]}|"></a></th:block>
</div>

<form id="lib-bulk" method="post" action="/library/bulk" data-write="1" data-reload class="bulk-bar lib-bulk" hidden data-bulk>
    <input type="hidden" name="op" value="move" />
    <strong data-bulk-count data-bulk-label="고른 {n}건">고른 0건</strong>
    <span class="muted small">왼쪽 폴더에 끌어 놓아도 옮겨집니다</span>
    <span class="bulk-acts">
        <select name="categoryId" aria-label="옮길 폴더">
            <option th:each="x : ${allFolders}" th:value="${x.id}" th:text="${(x.depth == 1 ? '' : (x.depth == 2 ? '　└ ' : '　　└ ')) + x.name}"></option>
        </select>
        <button type="submit" class="btn">이 폴더로 옮기기</button>
        <button type="button" class="btn" data-bulk-op="star">★ 즐겨찾기</button>
        <input name="tags" maxlength="100" placeholder="붙일 태그" aria-label="붙일 태그" class="bulk-tag" />
        <button type="button" class="btn" data-bulk-op="tag">태그 붙이기</button>
        <button type="button" class="btn btn-quiet danger-text" data-bulk-delete="고른 자료를 지울까요? 원본 파일도 함께 지워집니다.">지우기</button>
    </span>
</form>

<p class="count-line" th:text="|${view == '' and !#lists.isEmpty(subFolders) ? '폴더 ' + #lists.size(subFolders) + '개 · ' : ''}자료 ${v.total}건${v.deep and cur != null and scope != 'all' ? ' (하위 폴더 포함)' : ''}${v.pages > 1 ? ' · ' + v.page + '/' + v.pages + '쪽' : ''}|"></p>
<p class="empty" th:if="${v.total == 0 and #lists.isEmpty(subFolders)}"
   th:text="${view == 'star'} ? '즐겨찾기한 자료가 없습니다. 자료 줄의 ☆를 누르면 여기에 모입니다.' : (${view == 'recent'} ? '아직 연 자료가 없습니다.' : (${#strings.isEmpty(q) and #strings.isEmpty(tag) and #strings.isEmpty(kind)} ? '이 폴더는 비어 있습니다. 위 \'파일 올리기\'로 넣거나 파일을 이 화면에 끌어 놓으세요.' : '맞는 자료가 없습니다. 범위를 \'전체\'로 바꾸거나 낱말을 줄여 보세요.'))"></p>
<table class="xt lib-table" th:unless="${v.total == 0 and #lists.isEmpty(subFolders)}" data-nofold>
    <thead><tr>
        <th scope="col" class="no-print c-chk"><input type="checkbox" form="lib-bulk" data-check-all="id" aria-label="이 쪽 모두 고르기" /></th>
        <th scope="col">이름</th><th scope="col" class="c-star"><span class="sr-only">즐겨찾기</span>★</th>
        <th scope="col" class="c-date" th:text="${view == 'recent'} ? '연 때' : '올린 날'">올린 날</th><th scope="col" class="num c-size">크기</th><th scope="col" class="no-print c-more"><span class="sr-only">메뉴</span></th>
    </tr></thead>
    <tbody>
    <tr class="fd" th:each="x : ${subFolders}" th:attr="data-folder-id=${x.id},data-folder-name=${x.name},data-depth=${x.depth},data-archive=${x.archive},data-parent=${x.parentId}" data-drop-folder draggable="true">
        <td class="no-print c-chk"></td>
        <td><a class="nm" th:href="@{/library(f=${x.id})}">
            <span class="bx k-f" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10h-17z" fill="currentColor" opacity=".35"/><path d="M3.5 6.5h6l2 2h9v10h-17z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
            <span><b th:text="${x.name}"></b><small th:text="|폴더 · 자료 ${x.total}건${#lists.isEmpty(x.children) ? '' : ' · 하위 폴더 ' + #lists.size(x.children) + '개'}|"></small></span></a></td>
        <td class="c-star"></td><td class="c-date"></td><td class="c-size"></td>
        <td class="no-print c-more"><button type="button" class="btn btn-quiet btn-sm" data-folder-menu th:aria-label="|${x.name} 폴더 메뉴|">⋯</button></td>
    </tr>
    <tr th:each="d : ${v.items}" th:id="|d-${d.Id}|" draggable="true" th:attr="data-doc-id=${d.Id}">
        <td class="no-print c-chk"><input type="checkbox" name="id" form="lib-bulk" th:value="${d.Id}" th:aria-label="|${d.Title} 고르기|" /></td>
        <td>
            <div class="nm">
                <span class="bx" th:classappend="|k-${d.Kind}|" aria-hidden="true" th:text="${#strings.isEmpty(d.Ext) ? 'FILE' : d.Ext}">FILE</span>
                <span>
                    <a class="doc-title" th:href="|/library/${d.Id}/file|" th:data-open-local="|/library/${d.Id}/open|" th:text="${d.Title}" title="눌러서 원본 열기"></a>
                    <small>
                        <a class="mini-tag" th:each="t : ${d.TagList}" th:href="@{/library(f=${f},view=${view},tag=${t})}" th:text="|#${t}|"></a>
                        <span class="muted fpath" th:if="${view != '' or scope == 'all' or v.deep}"><svg class="ti" aria-hidden="true"><use href="#i-folder" xlink:href="#i-folder"/></svg><span th:text="${d.FolderPath}"></span></span>
                        <span class="muted" th:text="${d.FileName}"></span>
                    </small>
                    <small class="snip" th:unless="${#strings.isEmpty(d.Snippet)}" th:text="${d.Snippet}"></small>
                    <small class="lib-cases" th:if="${linked[d.Id] != null}">감사 건:
                        <a th:each="c : ${linked[d.Id]}" th:href="|/cases/${c.CaseId}#related|" th:text="${c.Title}"></a></small>
                </span>
            </div>
        </td>
        <td class="c-star">
            <form method="post" action="/library/bulk" data-write="1" data-reload class="star-form">
                <input type="hidden" name="id" th:value="${d.Id}" /><input type="hidden" name="op" th:value="${d.Starred == 1} ? 'unstar' : 'star'" />
                <button type="submit" class="star" th:classappend="${d.Starred == 1} ? 'on'" th:text="${d.Starred == 1} ? '★' : '☆'"
                        th:aria-label="${d.Starred == 1} ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기'" th:title="${d.Starred == 1} ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기'"></button></form></td>
        <td class="c-date nowrap" th:text="${#strings.substring((view == 'recent' ? d.OpenedAt : d.RegisteredAt) + '          ', 0, 10)}"></td>
        <td class="num nowrap c-size" th:text="${d.SizeText}"></td>
        <td class="no-print c-more">
            <details class="ex-menu"><summary class="btn btn-quiet btn-sm" th:aria-label="|${d.Title} 메뉴|">⋯</summary>
                <div class="ex-form">
                    <div class="row-actions" style="margin:0">
                        <a class="btn btn-sm" th:href="|/library/${d.Id}/file|" th:data-open-local="|/library/${d.Id}/open|">열기</a>
                        <a class="btn btn-sm" th:href="|/library/${d.Id}/file?dl=1|">내려받기</a>
                        <a class="btn btn-sm" th:href="@{/library(f=${d.CategoryId})} + '#d-' + ${d.Id}" th:if="${view != '' or scope == 'all' or v.deep}">들어 있는 폴더</a>
                    </div>
                    <form method="post" th:action="|/library/${d.Id}/meta|" data-write="1" data-reload class="an-form">
                        <label class="field">제목<input name="title" required maxlength="200" th:value="${d.Title}" /></label>
                        <label class="field">폴더<select name="categoryId">
                            <option th:each="x : ${allFolders}" th:value="${x.id}" th:selected="${x.id == d.CategoryId}" th:text="${(x.depth == 1 ? '' : (x.depth == 2 ? '　└ ' : '　　└ ')) + x.name}"></option></select></label>
                        <label class="field">태그<input name="tags" maxlength="300" th:value="${d.Tags}" /></label>
                        <label class="field">메모<textarea name="note" rows="2" maxlength="2000" th:text="${d.Note}"></textarea></label>
                        <button type="submit" class="btn btn-primary btn-sm">저장</button>
                    </form>
                    <form method="post" action="/links/to-case" data-write="1" data-reload class="an-form" th:unless="${#lists.isEmpty(caseChoices)}">
                        <input type="hidden" name="kind" value="doc" /><input type="hidden" name="ref" th:value="${d.Id}" />
                        <label class="field">감사 건에 연결<select name="caseId" required>
                            <option value="">감사 건 고르기</option>
                            <option th:each="c : ${caseChoices}" th:value="${c.CaseId}" th:text="|${c.Year} · ${c.Title}|"></option></select></label>
                        <button type="submit" class="btn btn-sm">연결</button>
                    </form>
                    <form method="post" th:action="|/library/${d.Id}/delete|" data-write="1" data-reload th:data-confirm="|'${d.Title}'를 지울까요? 원본 파일도 함께 지워집니다.|">
                        <button type="submit" class="btn btn-quiet btn-sm danger-text">지우기</button></form>
                </div>
            </details>
        </td>
    </tr>
    </tbody>
</table>
<nav class="pager no-print" th:if="${v.pages > 1}" aria-label="쪽">
    <a class="btn btn-sm" th:if="${v.page > 1}" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},kind=${kind},tag=${tag},sort=${sort},page=${v.page - 1})}">‹ 앞</a>
    <th:block th:each="n : ${#numbers.sequence(1, v.pages)}">
        <a class="btn btn-sm" th:if="${n == 1 or n == v.pages or (n >= v.page - 2 and n <= v.page + 2)}" th:classappend="${n == v.page} ? 'btn-primary'"
           th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},kind=${kind},tag=${tag},sort=${sort},page=${n})}" th:text="${n}" th:aria-current="${n == v.page} ? 'page'"></a>
    </th:block>
    <a class="btn btn-sm" th:if="${v.page < v.pages}" th:href="@{/library(f=${f},view=${view},q=${q},scope=${scope},kind=${kind},tag=${tag},sort=${sort},page=${v.page + 1})}">뒤 ›</a>
</nav>
<p class="hintbar no-print">제목을 누르면 원본이 PC 프로그램으로 열립니다 · 폴더를 누르면 들어갑니다 · 자료 줄이나 폴더를 끌어 왼쪽 폴더에 놓으면 옮겨집니다 · 윈도우 탐색기에서 파일을 이 화면에 끌어 놓으면 지금 폴더로 올라갑니다</p>
<div class="drop-cover" hidden data-drop-cover><div><strong>여기에 놓으면 올라갑니다</strong><small th:text="|'${uploadToName}' 폴더|"></small></div></div>
</div>
<!-- 폴더 메뉴(오른쪽 클릭·⋯) -->
<div class="ctx" id="folder-ctx" hidden role="menu">
    <button type="button" role="menuitem" data-ctx="new">새 하위 폴더</button>
    <button type="button" role="menuitem" data-ctx="rename">이름 바꾸기 <kbd>F2</kbd></button>
    <button type="button" role="menuitem" data-ctx="top">맨 위로 꺼내기</button>
    <button type="button" role="menuitem" data-ctx="archive">보관으로 옮기기</button>
    <hr />
    <button type="button" role="menuitem" data-ctx="delete" class="danger-text">지우기</button>
</div>
</th:block>
</body>
</html>
