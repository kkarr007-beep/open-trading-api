<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>사규 등록 · 사규</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1 th:text="${revise != null} ? |「${revise.title}」 개정판 넣기| : '사규 등록'">사규 등록</h1>
        <p class="hint">사규 글을 붙여 넣거나 파일(한글 hwp·hwpx, 워드 docx, PDF, txt)을 고릅니다. 제N장·제N조(제목)·①항·1.호·가.목·부칙·별표를 알아서 가릅니다.
            문서보안이 걸린 파일은 이 컴퓨터의 한글·워드로 열어 글자를 받아 옵니다.</p>
    </div>
</div>
<section class="card">
    <form method="post" action="/rules/new" data-write="1" enctype="multipart/form-data">
        <input type="hidden" name="reviseOf" th:if="${revise != null}" th:value="${revise.id}" />
        <div class="form-grid">
            <label class="field grow" th:if="${revise == null}">사규 이름 <span class="field-note">파일을 고르고 비워 두면 파일 이름을 씁니다.</span><input name="title" maxlength="120" placeholder="취업규칙" /></label>
            <label class="field" th:if="${revise == null}">카테고리<select name="categoryId"><option value="">미분류</option><option th:each="c : ${cats}" th:value="${c.id}" th:text="${c.name}"></option></select></label>
            <label class="field">판 이름<input name="label" maxlength="60" th:placeholder="${revise != null} ? '개정 2026.11' : '제정'" /></label>
            <label class="field">시행일<input name="effectiveDate" type="date" th:value="${today}" /></label>
            <label class="field grow" th:if="${revise != null}">개정 요지<textarea name="note" rows="2" maxlength="500"></textarea></label>
        </div>
        <div class="drop">
            <p class="drop-copy"><strong>파일을 고르거나 끌어 놓으세요</strong> (고르면 아래 붙여 넣은 글보다 먼저 씁니다)</p>
            <input type="file" name="upload" accept=".hwp,.hwpx,.docx,.doc,.pdf,.txt,.md,.rtf" aria-label="사규 파일" />
            <span class="drop-name" data-file-name hidden></span>
        </div>
        <label class="field grow" style="margin-top:14px">사규 글 붙여 넣기
            <textarea name="text" rows="18" class="textarea-wide mono" data-rule-paste placeholder="제1장 총칙&#10;제1조(목적) 이 규칙은 …&#10;제2조(정의) ① …"></textarea></label>
        <p class="hint" th:if="${revise != null}">같은 조 번호는 이전 판의 해석 어려움 표시·태그·메모를 이어받습니다. 사규 화면의 '앞 판과 견주기'로 바뀐 곳을 봅니다.</p>
        <p style="margin-top:12px"><button type="submit" class="btn btn-primary" th:text="${revise != null} ? '개정판 넣기' : '등록'">등록</button></p>
    </form>
</section>
</th:block>
</body>
</html>
