<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>사규 등록 · 사규</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1 th:text="${revise != null} ? |새 개정 버전 추가 — ${revise.title}| : '사규 등록'">사규 등록</h1>
        <p class="hint">① 사규 정보를 적고 ② 문서 파일(한글 hwp·hwpx, 워드, PDF, txt)을 고르면 ③ 조·항·호·부칙·별표로 나눈 <strong>분석 미리보기</strong>가 나옵니다.
            조 번호·제목·내용을 고치고, 잘못 나뉜 조는 '위와 병합'·'분할'로 바로잡은 뒤 ④ 확정 저장합니다.</p>
    </div>
</div>
<section class="card" id="rule-import" th:attr="data-revise=${revise != null ? revise.id : ''}">
    <div class="form-grid">
        <label class="field grow">사규명<input id="imT" maxlength="120" th:value="${revise != null ? revise.title : ''}" th:disabled="${revise != null}" placeholder="예) 취업규칙 (비우면 파일 이름)" /></label>
        <label class="field">카테고리<select id="imC" th:disabled="${revise != null}"><option value="">미분류</option><option th:each="c : ${cats}" th:value="${c.id}" th:text="${c.name}"></option></select></label>
        <label class="field">버전 이름<input id="imV" maxlength="60" th:value="${revise != null} ? |개정 ${#lists.size(revise.versions) + 1}| : '제정'" /></label>
        <label class="field">시행일<input id="imD" type="date" th:value="${today}" /></label>
        <label class="field grow"><span class="flabel">개정 사유 <span class="field-note">선택</span></span><input id="imR" maxlength="500" /></label>
    </div>
    <div class="drop">
        <p class="drop-copy"><strong>사규 문서 파일을 고르거나 끌어 놓으세요</strong> — 고르면 바로 읽어서 분석합니다</p>
        <input type="file" id="imF" accept=".hwp,.hwpx,.docx,.doc,.pdf,.txt,.md,.rtf" aria-label="사규 파일" />
        <span class="drop-name" data-file-name hidden></span>
    </div>
    <details style="margin-top:12px">
        <summary class="small muted">파일 없이 글을 붙여 넣기 (문서보안 때문에 파일을 못 고를 때)</summary>
        <textarea id="imX" aria-label="붙여 넣을 사규 글" rows="12" class="textarea-wide mono" data-rule-paste placeholder="제1조(목적) 이 규칙은 …&#10;① …&#10;1. …&#10;  가. …" style="margin-top:8px"></textarea>
    </details>
    <p class="row-actions" style="margin-top:12px">
        <button type="button" class="btn btn-primary" id="imP">분석 미리보기</button>
        <span class="hint" style="margin:0">본문 속 '제5조에 따라', '이 조', '동조' 같은 표현은 새 조로 나누지 않습니다.</span>
    </p>
</section>
<section id="imPrev"></section>
<script src="/js/rule-import.js" defer></script>
</th:block>
</body>
</html>
