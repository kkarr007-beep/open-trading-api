<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title th:text="|원본 · ${title}|">원본 보기</title>
<script src="/js/theme.js"></script>
<link rel="icon" type="image/png" href="/icons/app.png" />
<link rel="stylesheet" href="/css/original.css" />
</head>
<body th:attr="data-key=${key},data-rule=${isRule}">
<div class="bar">
    <h1 th:text="${title}">원본</h1>
    <span class="tag" id="via">등록 당시 원본 모양 · 고칠 수 없음 · 글자 찾기 됨</span>
    <span class="grow"></span>
    <input id="q" type="search" placeholder="원본에서 찾기 (Enter)" autocomplete="off" />
    <button class="b" id="prev" type="button" title="이전 (Shift+Enter)">이전</button>
    <span class="cnt" id="cnt"></span>
    <button class="b" id="next" type="button" title="다음 (Enter)">다음</button>
    <button class="b" id="zo" type="button" title="작게">−</button>
    <button class="b" id="zf" type="button" title="창 너비에 맞춤">맞춤</button>
    <button class="b" id="zi" type="button" title="크게">+</button>
    <button class="b" id="pr" type="button">인쇄</button>
    <a class="b" id="dpdf" th:href="|/original/${key}/pdf|" hidden>PDF 내려받기</a>
    <a class="b" id="dsrc" th:href="|/original/${key}/source|" hidden>원본 내려받기</a>
</div>
<div id="box">
    <div class="msg" th:if="${missing}"><h2>원본을 찾을 수 없습니다</h2><p>자료나 사규가 지워졌을 수 있습니다. 창을 닫으세요.</p></div>
    <div class="msg" th:if="${!missing and info == null}">
        <h2>원본 파일이 없습니다</h2>
        <p th:if="${isRule}">이 사규는 원본 파일 없이 글로만 등록되었습니다. 사규 화면의 <b>원본 파일 붙이기</b>로 한글·워드·PDF 파일을 올리면 원본 모양을 볼 수 있습니다.</p>
        <p th:unless="${isRule}">이 자료 형식은 원본 보기를 만들 수 없습니다. 목록에서 제목을 눌러 이 컴퓨터의 프로그램으로 여세요.</p>
    </div>
</div>
<div id="pages"></div>
<script src="/js/original.js"></script>
</body>
</html>
