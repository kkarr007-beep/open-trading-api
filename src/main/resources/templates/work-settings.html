<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>업무 설정 · 업무 일정</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <h1>업무 설정</h1>
        <p class="hint" th:text="|항목 ${count}건 · 데이터는 Portal의 데이터 파일 하나에 함께 저장되고, 관리 화면의 백업에 함께 들어갑니다.|"></p>
    </div>
    <div class="row-actions no-print"></div>
</div>
<section class="card" id="import">
    <h2>백업·옮겨 오기·내려받기</h2>
    <p class="hint">업무 자료는 프로그램 전체 백업에 함께 들어갑니다. 백업, 백업에서 되돌리기, 예전 프로그램 파일 옮겨 오기는 설정의 <strong>백업·복원·옮기기</strong> 한 곳에서 합니다.</p>
    <p class="row-actions"><a class="btn btn-primary" href="/import">백업·복원·옮기기 열기</a> <a class="btn" href="/work/data/export">업무 JSON 내려받기</a> <a class="btn" href="/work/export?scope=all">CSV 내려받기</a></p>
</section>
<section class="card">
    <h2>기본</h2>
    <form method="post" action="/work/settings/basics" data-write="1">
        <div class="form-grid">
            <label class="field">파트 이름<input name="partName" required maxlength="40" th:value="${cfg.partName}" /></label>
            <label class="field">나 (오늘 화면의 기준)<select name="me"><option th:each="o : ${cfg.owners}" th:value="${o.id}" th:text="${o.n}" th:selected="${o.id == cfg.me}"></option></select></label>
            <label class="field">정체 판정 (일)<input name="stalled" type="number" min="1" max="90" required th:value="${cfg.stalled}" /></label>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
    </form>
</section>
<section class="card">
    <h2 id="owners">담당자</h2>
    <p class="hint">용량은 한 사람이 동시에 맡을 업무 수입니다. 넘으면 담당별 업무 화면에 '용량 초과'가 뜹니다. 쓰지 않는 사람은 '숨김'으로 둡니다.</p>
    <form th:each="o : ${cfg.owners}" method="post" action="/work/settings/owner" data-write="1" class="inline-form inline-row">
        <input type="hidden" name="id" th:value="${o.id}" />
        <label class="field">이름<input name="n" required maxlength="40" th:value="${o.n}" /></label>
        <label class="field">용량<input name="cap" type="number" min="0" max="99" th:value="${o.cap}" style="width:90px" /></label>
        <label class="field" th:if="${o.id != 'ow0'}">보이기<select name="on"><option value="1" th:selected="${o.on}">보임</option><option value="0" th:selected="${!o.on}">숨김</option></select></label>
        <button type="submit" class="btn">저장</button>
    </form>
    <form method="post" action="/work/settings/owner" data-write="1" class="inline-form inline-row" style="margin-top:14px">
        <label class="field">새 담당자<input name="n" required maxlength="40" /></label>
        <label class="field">용량<input name="cap" type="number" min="0" max="99" value="6" style="width:90px" /></label>
        <button type="submit" class="btn btn-primary">더하기</button>
    </form>
</section>
<section class="card">
    <h2>업무 유형과 단계</h2>
    <p class="hint">단계는 쉼표로 나눠 적습니다. 업무 상세에서 단계를 누르면 진척이 계산됩니다.</p>
    <form th:each="t : ${cfg.types}" method="post" action="/work/settings/type" data-write="1" class="inline-form inline-row">
        <input type="hidden" name="id" th:value="${t.id}" />
        <label class="field">유형<input name="n" required maxlength="40" th:value="${t.n}" /></label>
        <label class="field wide">단계<input name="stages" maxlength="400" th:value="${t.stageLine}" placeholder="계획, 자료요청, 점검, 보고" /></label>
        <button type="submit" class="btn">저장</button>
    </form>
    <form method="post" action="/work/settings/type" data-write="1" class="inline-form inline-row" style="margin-top:14px">
        <label class="field">새 유형<input name="n" required maxlength="40" /></label>
        <label class="field wide">단계<input name="stages" maxlength="400" /></label>
        <button type="submit" class="btn btn-primary">더하기</button>
    </form>
</section>
<section class="card">
    <h2>과제</h2>
    <form th:each="p : ${cfg.projects}" method="post" action="/work/settings/project" data-write="1" class="inline-form inline-row">
        <input type="hidden" name="id" th:value="${p.id}" />
        <label class="field wide">과제<input name="n" required maxlength="40" th:value="${p.n}" /></label>
        <label class="field">상태<select name="on"><option value="1" th:selected="${p.on}">진행</option><option value="0" th:selected="${!p.on}">닫음</option></select></label>
        <button type="submit" class="btn">저장</button>
    </form>
    <form method="post" action="/work/settings/project" data-write="1" class="inline-form inline-row" style="margin-top:14px">
        <label class="field wide">새 과제<input name="n" required maxlength="40" /></label>
        <button type="submit" class="btn btn-primary">더하기</button>
    </form>
</section>
</th:block>
</body>
</html>
