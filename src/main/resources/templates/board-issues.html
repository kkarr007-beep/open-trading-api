<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::#content})}">
<head><title>이슈 · 경영현황</title></head>
<body>
<th:block id="content">
<div class="page-head">
    <div>
        <p class="kicker">경영현황</p>
        <h1>이슈</h1>
        <p class="hint">사업부별 이슈를 등급(상·중·하)과 상태로 관리합니다. '상' 등급의 진행 중 이슈는 종합 현황의 '확인 필요'에 나옵니다.</p>
    </div>
    <div class="row-actions no-print">
        <form method="post" action="/board/issues/auto" data-write="1" class="inline-form" data-confirm="이번 달 기준 계획 이탈 지표마다 이슈 초안을 만들까요? 이미 같은 이슈가 있으면 건너뜁니다.">
            <input type="hidden" name="p" value="m" /><button type="submit" class="btn">계획 이탈 → 이슈 초안</button></form>
    </div>
</div>
<section class="card" id="issue-form">
    <h2 th:text="${ed != null} ? '이슈 고치기' : '이슈 등록'">이슈 등록</h2>
    <form method="post" action="/board/issues/save" data-write="1">
        <input type="hidden" name="id" th:value="${editId}" />
        <div class="form-grid">
            <label class="field">조직<select name="org" required>
                <option th:each="o : ${d.orgs}" th:value="${o.id}" th:text="${o.name}" th:selected="${ed != null and ed.org == o.id}"></option></select></label>
            <label class="field"><span class="flabel">하위 조직 <span class="field-note">선택</span></span><input name="unit" list="units" maxlength="80" th:value="${ed != null ? ed.unit : ''}" /></label>
            <label class="field">구분<select name="cat"><option th:each="x : ${CATS}" th:value="${x}" th:text="${x}" th:selected="${ed != null and ed.cat == x}"></option></select></label>
            <label class="field">등급<select name="lv"><option th:each="x : ${LEVELS}" th:value="${x}" th:text="${x}" th:selected="${ed != null ? ed.level() == x : x == '중'}"></option></select></label>
            <label class="field">상태<select name="st"><option th:each="x : ${STATES}" th:value="${x}" th:text="${x}" th:selected="${ed != null and ed.st == x}"></option></select></label>
            <label class="field grow">제목<input name="title" required maxlength="200" th:value="${ed != null ? ed.title : ''}" /></label>
            <label class="field grow"><span class="flabel">내용 <span class="field-note">원인·조치 계획·기한</span></span><textarea name="note" rows="3" maxlength="4000" th:text="${ed != null ? ed.note : ''}"></textarea></label>
        </div>
        <datalist id="units"><th:block th:each="o : ${d.orgs}"><option th:each="u : ${o.units}" th:value="${u}"></option></th:block></datalist>
        <p class="row-actions"><button type="submit" class="btn btn-primary" th:text="${ed != null} ? '고친 내용 저장' : '등록'">등록</button>
            <a class="btn btn-quiet" th:if="${ed != null}" href="/board/issues">취소</a></p>
    </form>
</section>
<form method="get" action="/board/issues" class="toolbar" style="margin-bottom:10px">
    <label class="field">조직<select name="org" data-autosubmit><option value="">전체 조직</option>
        <option th:each="o : ${d.orgs}" th:value="${o.id}" th:text="${o.name}" th:selected="${forg == o.id}"></option></select></label>
    <label class="field">상태<select name="st" data-autosubmit>
        <option value="open" th:selected="${fst == 'open'}">진행 중(해결 뺌)</option><option value="해결" th:selected="${fst == '해결'}">해결</option>
        <option value="all" th:selected="${fst == 'all'}">전체</option></select></label>
</form>
<p class="count-line" th:text="|${#lists.size(list)}건|"></p>
<p class="empty" th:if="${#lists.isEmpty(list)}">해당하는 이슈가 없습니다.</p>
<div class="table-wrap" th:unless="${#lists.isEmpty(list)}">
    <table class="data">
        <thead><tr><th scope="col">등급</th><th scope="col">제목 · 내용</th><th scope="col">조직</th><th scope="col">구분</th><th scope="col">상태</th><th scope="col">등록</th><th scope="col" class="no-print"></th></tr></thead>
        <tbody><tr th:each="e : ${list}" th:with="x=${e.value}" th:id="|i-${e.key}|">
            <td><span class="pill" th:classappend="${x.level() == '상'} ? 'bad' : (${x.level() == '중'} ? 'warn' : '')" th:text="${x.level()}"></span></td>
            <th scope="row"><span th:text="${x.title}"></span><div class="small muted bd-note" th:if="${!#strings.isEmpty(x.note)}" th:text="${x.note}"></div></th>
            <td class="nowrap"><span th:text="${d.orgName(x.org)}"></span><div class="small muted" th:text="${x.unit}"></div></td>
            <td class="nowrap" th:text="${x.cat}"></td>
            <td class="nowrap"><span class="pill" th:classappend="${x.st == '해결'} ? 'ok' : ''" th:text="${x.st}"></span></td>
            <td class="nowrap small" th:text="${x.at == null or #strings.length(x.at) < 10} ? '' : ${#strings.substring(x.at, 0, 10)}"></td>
            <td class="nowrap no-print"><a class="btn btn-quiet" th:href="@{/board/issues(edit=${e.key})} + '#issue-form'">고치기</a>
                <form method="post" th:action="|/board/issues/${e.key}/delete|" data-write="1" class="inline-form" th:data-confirm="|'${x.title}' 이슈를 지울까요?|">
                    <button type="submit" class="btn btn-quiet">지우기</button></form></td>
        </tr></tbody>
    </table>
</div>
</th:block>
</body>
</html>
