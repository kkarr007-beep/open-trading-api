.art header{display:flex;justify-content:space-between;align-items:center;gap:8px}.art h3{margin:0;font-size:16px}.art .no{color:var(--pri)}.acts{opacity:.35;transition:opacity .2s;white-space:nowrap}.art:hover .acts,.art:focus-within .acts{opacity:1}

.xref{border-bottom:1px dotted var(--pri)}.anote{margin-top:8px;background:var(--warn);border-radius:6px;padding:6px 10px;font-size:14px;white-space:pre-wrap}

.pulse{animation:pulse 1.3s ease-out 2}.pulseb{box-shadow:0 0 0 2px #f97316}

.mg,.net{width:100%;height:auto}.gl{fill:var(--ink)}.legend{font-size:12px;margin-top:6px}
.x{border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--ink)}

.dr{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;background:var(--pane)}.dr.warn{border-color:#f59e0b;background:var(--warn)}.drh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.drn{width:110px;font-weight:700}.drt{width:200px}.dbtn{margin-left:auto;display:flex;gap:4px}.drc{font-size:14px}
.fl{display:block;margin:6px 0;font-size:14px;color:var(--mut)}.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tbl th{background:var(--bg)}
.cmp td{width:50%}.cmp .old{background:color-mix(in srgb,#fee2e2 35%,transparent)}.cmp .new{background:color-mix(in srgb,#dbeafe 35%,transparent)}
.pre{white-space:pre-wrap;font-family:inherit;margin:0}del{color:#dc2626;background:#fee2e2;text-decoration:line-through}ins{color:var(--accent);background:var(--accent-muted);text-decoration:none;font-weight:600}
.mil{columns:3;font-size:14px}.mil a{display:block;break-inside:avoid}.simp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sbadge{font-weight:800;color:var(--acc);min-width:44px}

.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}.cli{display:block;padding:4px 0}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:14px}

/* ===== v5 레이아웃 안정화 (설계 §3·§7, 기술동향 P0) ===== */
:root{--toph:56px}
body{word-break:keep-all;overflow-wrap:anywhere}
.para{white-space:pre-wrap;overflow-wrap:anywhere}.para.b{padding-inline-start:0}
.art,.hit,.scard,.toc a,.gl,.card,.li,.nfc{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.art h3{font-size:clamp(14px,1.1vw,16px);min-width:0;flex:1}.art header{flex-wrap:nowrap}
.acts{display:flex;align-items:center;flex:none}.more{position:relative}.more summary{list-style:none}.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:100%;background:var(--pane);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:4px;z-index:25;display:flex;flex-direction:column;min-width:170px}.more .menu .ib{text-align:left;padding:6px 10px;display:flex;gap:8px}.more .menu .ib span{font-size:13px}
.brand{display:flex;align-items:center;gap:10px}.brand>div{display:flex;flex-direction:column;line-height:1.25;min-width:0}.brand b{font-size:17px}.brand small{font-size:11px;font-weight:500;color:#94a3b8}.logo{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:18px}
.kbtn{display:flex;align-items:center;gap:6px;white-space:nowrap}.kbtn kbd{float:none;margin-left:auto}
#nav a{align-items:center;white-space:nowrap;overflow:hidden;min-width:0}#nav a>span:first-child{flex:none;width:20px;text-align:center}
.crumb{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save{white-space:nowrap}
.row>*,.rowh>*,.ht>*{min-width:0}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr)}
.cards{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))!important}
.li{overflow:hidden;text-overflow:ellipsis}.ell{display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}.tag{white-space:nowrap;vertical-align:middle}
.hit .ht b,.hit .ht a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hs{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.heroF .btn{white-space:nowrap;flex:none}.heroF input{min-width:0;font-size:17px}.btn,.chip{white-space:nowrap}
.newb{margin-left:auto;font-size:10px;font-weight:800;background:#f59e0b;color:#111;border-radius:999px;padding:0 6px;line-height:16px;flex:none}
.homegrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:4px}.homegrid .railc{margin:0}
.kpi{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin:0!important}
.frail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nfc{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--bg-elevated)}.nfc:hover{border-color:var(--pri);text-decoration:none}
.nfh{display:flex;align-items:center;gap:8px}.nfi{font-size:20px}.nfc small{color:var(--mut);font-size:12.5px;line-height:1.5}.nfc em{font-style:normal;font-size:12px;color:var(--pri);font-weight:600}

.gvel,.gvs text.gvel{font-size:var(--gv-efs,11px);paint-order:stroke fill;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
@media (max-width:800px){
  .gvs .gvl,.gvs .gvlf,.gvs .gvln{font-size:var(--gv-fs,12px)}
  .gvel,.gvs text.gvel{font-size:var(--gv-efs,11px)}
}

/* ===== QA: mobile never hide labels via hov ===== */
@media (max-width:800px){
  .gv[data-zl="hov"] .gvl,.gv[data-zl="hov"] .gvlb{opacity:1!important}
}


/* ===== v5 상단 4탭 (설계 사규_내비_v5 · 레일 폐기) ===== */
:root{
  --nav-accent:#5e6ad2;
  --nav-fg:#0f172a;
  --nav-muted:#64748b;
  --nav-dur:160ms;
  --nav-ease:cubic-bezier(.45,.05,.55,.95);
  --nav-tab-h:40px;
  --nav-bar-h:56px;
}
[data-theme=dark]{--nav-fg:#f0f0f2;--nav-muted:#94a3b8}
@media (prefers-reduced-motion:reduce){:root{--nav-dur:0ms}}

.top,main,#fileBanner{margin-left:0}
.top .brand{display:flex;align-items:center;gap:8px;padding:0;color:var(--nav-fg);text-decoration:none;flex:none;min-width:0}
.top .brand:hover{text-decoration:none;color:var(--nav-fg)}
.top .brand b{color:var(--nav-fg);font-size:15px;font-weight:600;white-space:nowrap}
.top .brand>div{display:flex;flex-direction:column;line-height:1.2}
.top .logo{flex:none;width:28px;height:28px;border-radius:8px;background:var(--nav-accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}

.top-tabs{display:flex;align-items:center;gap:2px;flex:none}
.top-tab{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--nav-tab-h);padding:0 12px;border:0;border-radius:8px;
  background:transparent;color:var(--nav-fg);font:inherit;font-size:13px;font-weight:500;
  cursor:pointer;text-decoration:none;position:relative;white-space:nowrap;
  transition:background var(--nav-dur) var(--nav-ease),color var(--nav-dur) var(--nav-ease);
}
.top-tab:hover{background:color-mix(in srgb,var(--nav-accent) 10%,transparent);text-decoration:none}
.top-tab.on,.top-tab[aria-current=page]{
  color:var(--nav-accent);
  background:color-mix(in srgb,var(--nav-accent) 12%,transparent);
}
.top-tab.on::after,.top-tab[aria-current=page]::after{
  content:"";position:absolute;left:10px;right:10px;bottom:4px;height:2px;
  background:var(--nav-accent);border-radius:1px;
}
.top-tab:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px;box-shadow:none}
.top-tab .ico{width:18px;height:18px;flex:none}


/* Flyout overlay — does not push main; shadow only (no border) */
.flyout{
  position:fixed;z-index:35;
  width:min(240px,80vw);max-height:min(80vh,640px);overflow:auto;
  background:var(--bg-elevated);color:var(--ink);
  border-radius:12px;
  box-shadow:var(--shadow-2);
  padding:8px;
}
.flyout[hidden]{display:none!important}
body.fly-open::before{
  content:"";position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:34;
  pointer-events:none;
}
.fly-panel{display:flex;flex-direction:column;gap:2px}
.fly-h{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--nav-muted);padding:8px 10px 4px}
.fly-a{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;
  color:var(--ink);text-decoration:none;font-size:13px;
}
.fly-a:hover,.fly-a:focus{background:color-mix(in srgb,var(--nav-accent) 10%,transparent);text-decoration:none;outline:none}
.fly-a.on{background:color-mix(in srgb,var(--nav-accent) 16%,transparent);color:var(--nav-accent)}
.fly-a:focus-visible{outline:2px solid var(--nav-accent);outline-offset:1px}

/* Desktop: hide mtab above 640 */
.mtab{display:none!important}

@media (max-width:640px){
  .top-tabs{display:none!important}
  .top,main,#fileBanner{margin-left:0}
  main{padding-bottom:72px}
  .mtab{
    display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:30;
    height:var(--nav-bar-h);align-items:center;
    background:var(--pane);border-top:1px solid var(--line);
    justify-content:space-around;
    padding:4px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.06);
  }
  .mtab a,.mtab button{
    flex:1;border:0;background:none;color:var(--ink);font:inherit;
    font-size:10px;padding:6px 4px;text-align:center;
    display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer;
  }
  .mtab a.on,.mtab button.on{color:var(--nav-accent);font-weight:700}
  .mtab .mti{display:grid;place-items:center;height:20px}
  .mtab .ico{width:20px;height:20px}
  .mtab a:focus-visible,.mtab button:focus-visible{outline:2px solid var(--nav-accent);outline-offset:2px}
  .flyout{left:0;right:0;bottom:var(--nav-bar-h);top:auto;width:auto;max-height:60vh;border-radius:12px 12px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.3)}
  body.fly-open::before{inset:0 0 var(--nav-bar-h) 0}
}
</style>
<style>

<style>

.reader[data-rv=list] .art:focus-within .acts{opacity:1}

/* ── 상단 하위 메뉴 줄 ──────────────────────────────── */
.sub-tabs{position:sticky;top:var(--top-h);z-index:14;display:flex;align-items:center;gap:18px;
  padding:0 20px;min-height:var(--nav-tab-h);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
  background:var(--bg-elevated);border-bottom:1px solid var(--line)}
.sub-tabs[hidden]{display:none}
.sub-g{display:flex;align-items:center;gap:2px;flex:0 0 auto}

  margin-right:6px;white-space:nowrap;letter-spacing:.02em}
.sub-g+.sub-g{border-left:1px solid var(--line);padding-left:16px}
.sub-a{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  padding:6px 9px;margin:4px 0;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:600;color:var(--ink-secondary);text-decoration:none;white-space:nowrap}
.sub-a:hover{background:var(--bg-sunken);color:var(--ink)}
.sub-a.on{background:var(--accent-muted);color:var(--accent)}
.sub-a .ico{flex:0 0 auto;opacity:.85}
@media (max-width:900px){ .sub-tabs{display:none!important} }
@media print{ .sub-tabs{display:none!important} }
</style>
<style>
/* ── ⑦ 엔터 줄바꿈 살리기 ───────────────────────────── */
.nl,.anote,.hn,.cki,.scard .small:not(.mut){white-space:pre-wrap}

/* ── ① 개정 전·후 견주기 ────────────────────────────── */
.warnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;

.report{max-width:1000px;margin:0 auto;background:var(--pane);border:1px solid var(--line);

/* ===== 표 ===== 칸 구분을 살린 한 줄 꼴로 보관한다: | 칸1 | 칸2 | 칸3 | */

/* ===== Word·한글 서식 → 글자 규칙 변환 =====

const MDB=/^(p|div|li|h[1-6]|blockquote|dt|dd|pre|tr|section|article|address|center)$/;

function cssPx(v){

function mdIndent(el){

  if(t==='body'||t==='html')break}

function mdAlign(el){

  if(a==='right')return '>>> ';
  if(a)return '';

  if(p.parentElement===null)break}

function mdInline(el){

  if(t==='img'){const a=n.getAttribute('alt')||'';out+=a?'[그림 '+a+']':'[그림]';return}

function mdHasBlock(el){

function mdLines(root){

  if(!txt.trim()){out.push('');return}

    if(z.trim())z.split('\n').forEach(x=>{const q=x.trim();if(q)out.push(q)});
    return}
   if(n.nodeType!==1)return;
   const t=n.tagName.toLowerCase();
   if(MDSKIP.test(t))return;

    const p=(el.tagName||'').toLowerCase();

   if(MDB.test(t)||t==='ul'||t==='ol'||t==='table'){

   emit(n)})};

/* Word·한글에서 붙여넣으면 딸려오는 스타일·주석 덩어리를 걷어낸다 */
const CSSLINE=/^\s*(?:[.#@*a-zA-Z][\w\-.#:,>\[\]="'()\s]*\{[^{}]*\}|[\w-]+\s*:[^;{}]*;|\}|\{|<!\[endif\]|<!\[if[^\]]*\]|\/\*.*\*\/)\s*$/;
const CSSHINT=/(mso-|font-family\s*:|text-indent\s*:|margin-(top|bottom|left|right)\s*:|line-height\s*:|page:\s*WordSection|@(page|font-face|media)|\bcharset\b)/i;
function dropStyleJunk(t){

  if(!z){out.push('');return}
  if(CSSLINE.test(z)&&CSSHINT.test(z))return;
  if(/^<!--/.test(z)||/^-->$/.test(z))return;
  if(CSSHINT.test(z)&&z.indexOf('{')>=0&&z.indexOf('}')>=0)return;

function sanitize(s){const d=defaultState();for(const k in d)if(s[k]===undefined||s[k]===null||(Array.isArray(d[k])&&!Array.isArray(s[k])))s[k]=d[k];

 save(){this.dirty=true;this.dg=(this.dg||0)+1;this.setStatus('pending');clearTimeout(this.timer);this.timer=setTimeout(()=>this.persist(),350)},

 async _persist(silent){const gen=this.dg||0;const s=this.state;s.rev=(s.rev||0)+1;s.savedAt=nowISO();const json=JSON.stringify(s);let okL=true,okI=true,okF=null;

 setStatus(st){this.status=st;const e=document.getElementById('saveStatus');if(!e)return;const r=this.lastResult||{};const t=r.at?new Date(r.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';

 async connectFile(create){if(!window.showSaveFilePicker){toast('이 브라우저는 파일 자동 저장을 지원하지 않습니다(크롬/엣지 사용). JSON 내보내기를 이용하세요.','error');return}

 const autoIndent=()=>{
  const v=ta.value,p=ta.selectionStart;
  const ls=v.lastIndexOf('\n',p-1)+1;
  const line=v.slice(ls,p);
  let pad=(/^[\t ]*/.exec(line)||[''])[0].replace(/\t/g,'  ');
  const mk=/^[\t ]*([\u2460-\u2473]|\(\d+\)|\d+\.|[가-하]\.|[-·•])\s+/.exec(line);
  if(mk)pad+=' '.repeat(Math.min(8,mk[0].length-pad.length));
  put('\n'+pad)};
 const shiftLines=(dir)=>{
  const v=ta.value;let a=v.lastIndexOf('\n',ta.selectionStart-1)+1;
  let b=v.indexOf('\n',ta.selectionEnd);if(b<0)b=v.length;
  const seg=v.slice(a,b).split('\n').map(l=>dir>0?'  '+l:l.replace(/^ {1,2}/,'')).join('\n');
  ta.value=v.slice(0,a)+seg+v.slice(b);
  ta.selectionStart=a;ta.selectionEnd=a+seg.length;
  ta.dispatchEvent(new Event('input',{bubbles:true}))};
 ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey){e.preventDefault();autoIndent();return}
  if(e.key==='Tab'){e.preventDefault();
   if(ta.selectionStart!==ta.selectionEnd||e.shiftKey)shiftLines(e.shiftKey?-1:1);else put('  ');
   return}});

 const q=$('#pq');q.oninput=()=>palUpdate(q.value);q.onkeydown=e=>{if(e.key==='ArrowDown'){PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1);palDraw();e.preventDefault()}else if(e.key==='ArrowUp'){PAL.sel=Math.max(0,PAL.sel-1);palDraw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();if(e.shiftKey&&q.value.trim())return palRun({go:'#/solution?q='+encodeURIComponent(q.value.replace(/^\?/,'').trim())});palRun(PAL.items[PAL.sel])}else if(e.key==='Escape')closePalette()};

 else if(q.startsWith('?')){const t=q.slice(1).trim();items=[{t:'상황 솔루션: '+(t||'…'),go:'#/solution?q='+encodeURIComponent(t),q:t}]}
 else if(!q){items=TOP_TABS.map(t=>({t:t.lab,go:t.route?(LAST_TAB_HASH[t.id]||('#/'+t.route)):null,fn:t.route?null:()=>openFlyout('more',moreTrigger())})).concat(S().recentSearches.slice(0,4).map(x=>({t:x,go:'#/search?q='+encodeURIComponent(x)}))).concat(S().recentViews.slice(0,4).map(k=>{const[r,a]=k.split('::');const art=findArt(r,a);return art?{t:findReg(r).title+' '+artLabel(art),go:link(r,a)}:null}).filter(Boolean)).concat(featNews?featNews().map(f=>({t:'NEW · '+f.title,go:f.href})):[]).concat(CMDS().slice(0,3))}
 else{const R=search(q);items=R.hits.slice(0,8).map(h=>({t:h.u.r.title+' '+artLabel(h.u.a)+(h.para?' '+paraLabel(h.para):''),sub:snippet(h.u,h.terms,90),go:link(h.u.r.id,h.u.a.id,h.para,h.terms.join('|')),q}));

  S().regulations.filter(r=>nk(r.title).includes(nk(q))).forEach(r=>items.unshift({t:r.title,go:link(r.id)}))}
 PAL.items=items;PAL.sel=0;palDraw()}

function loadSample(){const s=S();SAMPLE.forEach(x=>{if(s.regulations.some(r=>r.title===x.t))return;let c=s.categories.find(c=>c.name===x.c);if(!c){c={id:uid('c'),name:x.c,order:s.categories.length+1};s.categories.push(c)}const ver={id:uid('v'),label:'제정',effectiveDate:'2024-01-01',reason:'샘플',articles:parseRegulationText(x.txt)};s.regulations.push({id:uid('r'),title:x.t,categoryId:c.id,departmentIds:[],status:'active',currentVersionId:ver.id,versions:[ver],relatedRegIds:[],createdAt:nowISO(),updatedAt:nowISO()})});
 const dr=s.regulations.find(r=>r.title==='징계규정');if(dr&&dr.versions.length===1){const t2=SAMPLE[1].txt.replace('최초 적발 시 감봉 이상','최초 적발 시 정직 이상').replace('7일 이내에 재심','10일 이내에 재심').replace('제9조(재심)','제8조의2(징계의 효력) 징계는 서면 통보가 대상자에게 도달한 날부터 효력이 발생한다.\n제9조(재심)');const v2={id:uid('v'),label:'개정',effectiveDate:'2025-07-01',reason:'음주운전 양정 강화, 재심 기간 연장',articles:parseRegulationText(t2)};const old=dr.versions[0].articles;v2.articles.forEach(a=>{const o=old.find(x=>x.number===a.number);if(o)a.id=o.id});dr.versions.push(v2);dr.currentVersionId=v2.id}
 const wr=s.regulations.find(r=>r.title==='취업규칙');if(wr&&!s.riskAssessments.some(a=>a.targetId===wr.id))s.riskAssessments.push({id:uid('ra'),targetId:wr.id,likelihood:4,impact:4,notes:'괴롭힘·음주 관련 분쟁 빈발',lastAuditDate:'',nextAuditDate:'2026-12-01',auditCycle:'annual',updatedAt:nowISO()});
 if(dr){const a5=arts(dr).find(a=>a.number==='제5조');if(a5&&!s.notes[dr.id+'::'+a5.id])s.notes[dr.id+'::'+a5.id]='음주운전: 사내 차량 이용 또는 근무시간 중이면 1단계 가중 검토. 형사 판결 전이라도 측정 결과로 징계 가능(인사팀 해석, 2025).'}
 save()}

async function boot(){$('#modal').hidden=true;$('#palette').hidden=true;renderNav();Store.setStatus('pending');let notice='';try{notice=await Store.load()}catch(e){console.error(e);Store.state=defaultState();notice='저장소를 읽지 못해 빈 상태로 시작했습니다. 기존 데이터는 덮어쓰지 않았습니다. 설정 › 스냅샷/JSON 가져오기를 확인하세요.'}
 renderNav();applyTheme();renderFileBanner();Store.setStatus('saved');if(notice)toast(notice,/손상|못해/.test(notice)?'error':'success');
 $('#themeBtn').onclick=toggleTheme;$('#openPalette').onclick=()=>openPalette();const mt=$('#mtMore');if(mt)mt.onclick=()=>openFlyout('more',mt);
 if(!location.hash)location.hash='#/dashboard';else rerender()}
boot();

/* ===== v5 업그레이드: 연결 지도(사규↔조문 드릴다운) · Feature rail · NEW 배지 · 3단계 투어 ===== */
const V5C=['#0072B2','#009E73','#D55E00','#CC79A7','#56B4E9','#E69F00','#7f6d00','#444'];
function v5Color(rid){const i=S().regulations.findIndex(r=>r.id===rid);return V5C[(i<0?0:i)%V5C.length]}
/* 그래프는 graph.js GraphView 단일 구현 사용 (a8 drawGraph/forceLayout/network·miniGraph 오버라이드 제거) */
/* 홈 Feature 카드 (확장형 배열: 항목만 추가하면 홈·팔레트에 반영, 홈은 최대 4개) */
const FEATURES=[
 {id:'network',icon:'share',title:'연결 지도',desc:'인용·피인용·유사 조항을 겹침 없는 지도로 — 확대·이동·필터',href:'#/network',since:'2026-11-05'},
 {id:'compare',icon:'compare',title:'신구 조문 비교',desc:'개정 전후를 좌우 대비로 한눈에',href:'#/compare',since:'2026-11-05'},
 {id:'solution',icon:'spark',title:'상황 질의·솔루션',desc:'상황을 적으면 근거→사유→수위→절차 순서로 정리',href:'#/solution?q=%EC%9D%8C%EC%A3%BC%EC%9A%B4%EC%A0%84',since:'2026-11-05'},
 {id:'similar',icon:'layers',title:'유사 조항',desc:'조문 옆 [연관] 패널에서 유사도 ≥12% 조항 확인',href:'#/search',since:'2026-11-05'},
 {id:'backup',icon:'shield',title:'이중 백업',desc:'브라우저 2곳 저장 + 스냅샷 + PC JSON 자동 저장',href:'#/settings',since:'2026-11-01'},
 {id:'import',icon:'upload',title:'스마트 붙여넣기',desc:'워드·한글 붙여넣기 → 조·항 자동 인식',href:'#/import',since:'2026-11-01'}];
const NEWF=FEATURES.map(f=>[f.icon,f.title,f.desc,f.href]);
function featNew(f){const s=S();if(!s)return false;s.ui=s.ui||{};const seen=(s.ui.seenFeatures||{})[f.id];const age=(Date.now()-new Date(f.since).getTime())/864e5;return!seen&&age<=7}
function featNews(){return FEATURES.filter(featNew).sort((a,b)=>String(b.since).localeCompare(a.since)).slice(0,2)}
function showNew(f){return featNews().some(x=>x.id===f.id)}
function featSeen(id){const s=S();s.ui=s.ui||{};s.ui.seenFeatures=s.ui.seenFeatures||{};if(!s.ui.seenFeatures[id]){s.ui.seenFeatures[id]=nowISO();save()}}
function featureRail(n){return'<div class="nfg">'+FEATURES.slice(0,n||4).map(f=>'<a class="nfc" href="'+f.href+'" data-feat="'+f.id+'"><span class="nfi" aria-hidden="true">'+ico(f.icon)+'</span><b>'+esc(f.title)+(showNew(f)?' <span class="tag new">NEW</span>':'')+'</b><small>'+esc(f.desc)+'</small><em>바로 가기 →</em></a>').join('')+'</div>'}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-feat]');if(a)featSeen(a.dataset.feat)});
const _dash=ROUTES.dashboard;ROUTES.dashboard=async(m,p)=>{await _dash(m,p);if($('.newf',m))return;const h=$('.hero',m);if(!h)return;const d=document.createElement('section');d.className='newf homegrid';d.setAttribute('aria-label','추천 기능');d.innerHTML='<div class="railc"><div class="rowh"><h3>추천 기능</h3><button class="btn sm" id="tourBtn">사용 팁 다시 보기</button></div>'+featureRail(4)+'</div>';h.after(d);const st=$('.home-status',m)||$('.stats',m);if(st){st.classList.add('kpi');d.appendChild(st)}$('#tourBtn',d).onclick=()=>showTour(true)};
function polishChrome(){const kb=$('#openPalette');if(kb&&!kb.querySelector('.ico'))kb.insertAdjacentHTML('afterbegin',ico('search')+' ');const th=$('#themeBtn');if(th)th.innerHTML=ico((S()&&S().darkMode)?'sun':'moon')}
const TOUR=[['1. 검색','어디서든 Ctrl+K(또는 상단 검색)로 조 번호·키워드를 찾고, 결과를 누르면 해당 조·항으로 바로 이동합니다.'],['2. 솔루션','홈 입력창에 “직원이 음주운전으로 적발됐어요”처럼 상황을 쓰고 [솔루션]을 누르면 근거 사규·수위·절차가 나옵니다.'],['3. 연결 지도','찾기·연결 › 연결 지도에서 사규 간 인용·유사 관계를 확대·이동하며 보고, 노드를 누르면 조문 단위 연결을 봅니다.']];
function showTour(force){if(!force&&localStorage.getItem('regs.tourDone'))return;let i=0;const o=document.createElement('div');o.className='tour';const draw=()=>{o.innerHTML='<div class="tourc" role="dialog" aria-modal="true" aria-label="사용 팁"><button class="ib x" title="닫기" aria-label="닫기">'+ico('x')+'</button><div class="mut small">사용 팁 '+(i+1)+' / '+TOUR.length+'</div><h3>'+TOUR[i][0]+'</h3><p>'+TOUR[i][1]+'</p><div class="row"><button class="btn" data-k="skip">다시 보지 않기</button><div class="grow"></div>'+(i?'<button class="btn" data-k="prev">이전</button>':'')+'<button class="btn pri" data-k="next">'+(i<TOUR.length-1?'다음':'시작하기')+'</button></div></div>'};draw();
 const close=()=>{localStorage.setItem('regs.tourDone','1');o.remove();document.removeEventListener('keydown',esc_)};const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
 o.onclick=e=>{const k=e.target.dataset.k;if(e.target===o||e.target.closest('.x')||k==='skip')return close();if(k==='prev'){i--;draw()}if(k==='next'){if(i<TOUR.length-1){i++;draw()}else close()}};document.body.append(o)}
setTimeout(()=>{if(typeof polishChrome==='function')polishChrome();showTour()},300);
</script>
